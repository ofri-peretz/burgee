# Git hooks for the Interlace community repo.
#
# Pre-commit: fast, file-scoped — typecheck + format on staged files only.
# Commit-msg: enforce conventional-commits via commitlint.
# Pre-push: full CI battery so the developer ships green without waiting on
#   GitHub Actions feedback.

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
    # proofline intent R5, observe step: never blocks, logs to .git/proofline/gate.jsonl what
    # `enforce` would have blocked. Moving to enforce takes a decision file (intent, Constraints).
    proofline:
      run: '[ ! -f packages/proofline/dist/bin.js ] || node packages/proofline/dist/bin.js gate {1} --mode observe --quiet || true'

pre-commit:
  parallel: true
  commands:
    commitlint:
      run: 'true'

pre-push:
  commands:
    # One turbo invocation for all three: three parallel invocations each build the docs
    # app into the same .next directory and one of them loses (seen on every second push).
    # turbo still parallelises across packages inside the one run, two tasks at a time: ten at once
    # starved a machine with an endpoint scanner until the cases that spawn a process timed out at
    # 30 s (vitest-timeouts.config.ts measured two tasks clean 2 of 2, at +37 s). Every gate still runs.
    # Each suite leaves the cases it read over the 5 s budget in node_modules/.cache/case-budget,
    # and `case-budget` below judges them alone once the battery is over: inside it nothing is
    # alone (D-20261101-tests-under-5s).
    battery:
      priority: 1
      run: rm -rf node_modules/.cache/case-budget && VITEST_CASE_BUDGET_DEFER="$PWD/node_modules/.cache/case-budget" npx --no turbo run typecheck test build --output-logs=errors-only --concurrency=2
    # `turbo run test` covers workspaces, and `scripts/` is not one — the root vitest config
    # is the only thing that runs `scripts/**/*.test.ts`. So the gate that is supposed to be
    # what CI runs was missing a whole directory of locks, and `plan-progress-lock.test.ts`
    # went red on ubuntu and windows after a local `ci:local` reported 45/45 (2026-09-16).
    # This is the same line `npm test` already runs before its turbo half.
    root-suite:
      priority: 2
      run: npx --no vitest run --config vitest.root.config.ts
    # The changed-lines mutation lane (scripts/mutation-changed.sh), against origin/main: the
    # per-PR mutation gate. No workflow runs it (D-20261101-no-mutation-in-gha), so this hook is
    # the only place a surviving mutant on a changed line is caught before merge. It skips in
    # seconds when no package source line changed; otherwise it needs cargo for oxmutate's
    # native core, and says `fix:` without it.
    mutation-changed:
      priority: 3
      run: npm run mutation:changed
    # truemark diff, dogfooded: an assertion moved to a weaker matcher, or a snapshot changed with
    # no `Snapshot: <why>` line, in the commits since origin/main. The battery built its dist.
    # A deliberate weakening is accepted by an `Assertion: <why>` line in the commit message.
    truemark-diff:
      priority: 4
      run: node packages/truemark/dist/bin.js diff --base origin/main
    # The battery's verdict on the five-second budget, the same script as CI's `No test case over
    # 5 s` step. The root suite judges its own cases as it runs, alone already.
    case-budget:
      priority: 5
      run: npx --no tsx scripts/case-budget.ts node_modules/.cache/case-budget
    # The weight page (/docs/weight) is measured from the battery's build and committed, and the
    # Ratchet job fails when it is stale. That cost six CI cycles in one week (2026-11-23): a change
    # to one package moved another's row, and nothing local said so. The same check as compat.yml's
    # `The published weight page is the one this build generates`, run after the battery has built
    # every package (about 40 s of esbuild); fix a failure with `npm run weight:page`.
    weight-page:
      priority: 5
      run: npm run weight:page -- --check
