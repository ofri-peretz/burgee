# Git hooks for the Interlace community repo.
#
# Pre-commit: fast, file-scoped — typecheck + format on staged files only.
# Commit-msg: enforce conventional-commits via commitlint.
# Pre-push: full CI battery so the developer ships green without waiting on
#   GitHub Actions feedback.

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    commitlint:
      run: 'true'

pre-push:
  commands:
    # One turbo invocation for all three: three parallel invocations each build the docs
    # app into the same .next directory and one of them loses (seen on every second push).
    # turbo still parallelises across packages inside the one run.
    battery:
      priority: 1
      run: npx --no turbo run typecheck test build --output-logs=errors-only
    # `turbo run test` covers workspaces, and `scripts/` is not one — the root vitest config
    # is the only thing that runs `scripts/**/*.test.ts`. So the gate that is supposed to be
    # what CI runs was missing a whole directory of locks, and `plan-progress-lock.test.ts`
    # went red on ubuntu and windows after a local `ci:local` reported 45/45 (2026-09-16).
    # This is the same line `npm test` already runs before its turbo half.
    root-suite:
      priority: 2
      run: npx --no vitest run --config vitest.root.config.ts
    # The changed-lines mutation lane (scripts/mutation-changed.sh), against origin/main: the
    # per-PR mutation gate. No workflow runs it (D-20261101-no-mutation-in-gha), so this hook is
    # the only place a surviving mutant on a changed line is caught before merge. It skips in
    # seconds when no package source line changed; otherwise it needs cargo for oxmutate's
    # native core, and says `fix:` without it.
    mutation-changed:
      priority: 3
      run: npm run mutation:changed
