# Git hooks for the Interlace community repo.
#
# Pre-commit: fast, file-scoped — typecheck + format on staged files only.
# Commit-msg: enforce conventional-commits via commitlint.
# Pre-push: the CI battery over what this push changed (turbo --affected, vitest --changed against
#   origin/main), so a one-package push waits on that package, not on all of them. CI runs the
#   whole battery on every PR. The up-front build covers every package (later steps read every
#   package's dist) but no docs site: a lockfile change on main misses the cache for all 19 sites,
#   and that cold build alone overran the 4m cap. An affected site still builds, via test -> build.

commit-msg:
  commands:
    commitlint:
      timeout: 1m
      run: npx --no -- commitlint --edit {1}
    # provedone intent R5, enforced (D-20261124-provedone-enforce): a commit with no
    # `Verified-by:` trailer fails; `Verified-by: none (<why>)` passes, and after two blocks in one
    # session the next commit passes, logged to .git/provedone/gate.jsonl.
    provedone:
      timeout: 1m
      run: '[ ! -f packages/provedone/dist/bin.js ] || node packages/provedone/dist/bin.js gate {1} --mode enforce'
      fail_text: 'No receipt. Add `Verified-by: <command> -> exit 0`, or `Verified-by: none (<why no check applies>)`, and commit again.'

pre-commit:
  parallel: true
  commands:
    commitlint:
      timeout: 1m
      run: 'true'

# piped: steps run in priority order and the first failure stops the rest (no 3-minute wait to
# learn step 1 failed). Every step carries a timeout so a stuck one fails instead of hanging.
pre-push:
  piped: true
  commands:
    # One turbo invocation for all three: three parallel invocations each build the docs
    # app into the same .next directory and one of them loses (seen on every second push).
    # turbo still parallelises across packages inside the one run, two tasks at a time: ten at once
    # starved a machine with an endpoint scanner until the cases that spawn a process timed out at
    # 30 s (vitest-timeouts.config.ts measured two tasks clean 2 of 2, at +37 s). Every gate still runs.
    # Each suite leaves the cases it read over the 5 s budget in node_modules/.cache/case-budget,
    # and `case-budget` below judges them alone once the battery is over: inside it nothing is
    # alone (D-20261101-tests-under-5s).
    battery:
      timeout: 4m
      priority: 1
      run: rm -rf node_modules/.cache/case-budget && npx --no turbo run build --filter='./packages/*' --output-logs=errors-only --concurrency=2 && TURBO_SCM_BASE=origin/main TRUEPASS_BUDGET_DEFER="$PWD/node_modules/.cache/case-budget" npx --no turbo run typecheck test --affected --output-logs=errors-only --concurrency=2
    # `turbo run test` covers workspaces, and `scripts/` is not one — the root vitest config
    # is the only thing that runs `scripts/**/*.test.ts`. So the gate that is supposed to be
    # what CI runs was missing a whole directory of locks, and `plan-progress-lock.test.ts`
    # went red on ubuntu and windows after a local `ci:local` reported 45/45 (2026-09-16).
    # This is the same line `npm test` already runs before its turbo half.
    # What --changed finds through imports, plus the locks that read a changed non-code file as
    # text (scripts/root-suite-changed.mjs). Seconds for most pushes.
    root-suite:
      timeout: 3m
      priority: 2
      run: node scripts/root-suite-changed.mjs origin/main
    # The changed-lines mutation lane (scripts/mutation-changed.sh), against origin/main: the
    # per-PR mutation gate. No workflow runs it (D-20261101-no-mutation-in-gha), so this hook is
    # the only place a surviving mutant on a changed line is caught before merge. It skips in
    # seconds when no package source line changed; otherwise it runs in oxmutate's Docker container
    # (builds, native core and mutants all inside), and says `fix:` when Docker is not running.
    mutation-changed:
      timeout: 5m
      priority: 3
      run: npm run mutation:changed
    # truepass diff, dogfooded: an assertion moved to a weaker matcher, or a snapshot changed with
    # no `Snapshot: <why>` line, in the commits since origin/main. The battery built its dist.
    # A deliberate weakening is accepted by an `Assertion: <why>` line in the commit message.
    truepass-diff:
      timeout: 2m
      priority: 4
      run: node packages/truepass/dist/bin.js diff --base origin/main
    # triggerlist protect, dogfooded: a push that edits a gate file (listed in the base branch's
    # .sdlc/checklist.yaml) together with the code that gate judges. Observe mode, like the hookset
    # preset step the other repos run as `hook:triggerlist`; the battery built its dist.
    triggerlist-protect:
      timeout: 2m
      priority: 4
      run: node packages/triggerlist/dist/bin.js protect origin/main
    # The battery's verdict on the five-second budget, the same script as CI's `No test case over
    # 5 s` step. The root suite judges its own cases as it runs, alone already.
    case-budget:
      timeout: 2m
      priority: 5
      run: npx --no tsx scripts/case-budget.ts node_modules/.cache/case-budget
    # The weight page (/docs/weight) is measured from the battery's build and committed, and the
    # Ratchet job fails when it is stale. That cost six CI cycles in one week (2026-11-23): a change
    # to one package moved another's row, and nothing local said so. The same check as compat.yml's
    # `The published weight page is the one this build generates`, run after the battery has built
    # every package (about 40 s of esbuild); fix a failure with `npm run weight:page`.
    weight-page:
      timeout: 2m
      priority: 5
      run: npm run weight:page -- --check
    # `npm run lint` is CI's separate eslint job, and `ci:local` (the battery) does not run it, so a
    # lint finding used to surface only as a red CI run, and CLAUDE.md had to say "run lint too".
    # These run the same eslint and markdownlint over the files this push changes, after the
    # battery has built the packages the eslint config imports.
    lint-changed:
      timeout: 2m
      priority: 6
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      run: npx --no -- eslint --max-warnings 0 --no-warn-ignored {push_files}
    lint-changed-md:
      timeout: 2m
      priority: 6
      glob: '*.md'
      run: npx --no -- markdownlint-cli2 {push_files}
    lint-guidance:
      timeout: 2m
      priority: 6
      glob: '*.md'
      run: npm run -s lint:guidance
