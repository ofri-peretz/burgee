# Git hooks for the Interlace community repo.
#
# Pre-commit: fast, file-scoped — typecheck + format on staged files only.
# Commit-msg: enforce conventional-commits via commitlint.
# Pre-push: full CI battery so the developer ships green without waiting on
#   GitHub Actions feedback.

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    commitlint:
      run: 'true'

pre-push:
  commands:
    # One turbo invocation for all three: three parallel invocations each build the docs
    # app into the same .next directory and one of them loses (seen on every second push).
    # turbo still parallelises across packages inside the one run.
    battery:
      run: npx --no turbo run typecheck test build --output-logs=errors-only
