openapi: 3.1.0
info: { title: Wallet, version: 3.0.0 }
paths:
  /v3/wallet:
    get:
      operationId: getBalance
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
components:
  schemas:
    Balance:
      type: object
      required: [amount]
      properties:
        amount: { type: number, x-sunset: 2027-02-30, x-replaced-by: a/b }
        currency: { type: string, enum: [USD, EUR, GBP], x-change: '' }
        note: { type: string }
