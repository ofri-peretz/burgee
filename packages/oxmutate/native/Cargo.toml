[package]
name = "oxmutate_native"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "oxmutate's native core: mutants from the oxc AST, emitted as span edits."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
napi = { version = "3.15.0", default-features = false, features = ["napi6"], optional = true }
napi-derive = { version = "3.6.13", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
