# hookset preset — commit-msg. Pulled through lefthook `remotes` at a pinned `hookset@<version>`
# tag; never copy it into a repo (`hookset check` fails on a copy). The PATH tail is for GUI git
# clients that start hooks without the shell's PATH.
commit-msg:
  commands:
    hookset-commitlint:
      run: PATH="$PATH:/opt/homebrew/bin:/usr/local/bin" npx --no -- commitlint --edit {1}
      fail_text: "commitlint rejected the message. Each ✖ line above names the rule it broke (type, scope, length). Fix those and commit again."
    hookset-provedone:
      run: PATH="$PATH:/opt/homebrew/bin:/usr/local/bin" npm run --silent hook:provedone -- {1}
      fail_text: "No receipt. Add `Verified-by: <command> -> exit 0`, or `Verified-by: none (<why no check applies>)`, and commit again."
