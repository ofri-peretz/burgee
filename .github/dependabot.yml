# Weekly grouped dependency PRs, one at a time. Ported from ofri-peretz/eslint.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-packages:
        patterns: ["*"]
    # compat-oracle runs commander's and yargs' *own* test suites, vendored at a pinned
    # release, against their own devDependencies at that release (yargs' integration tests
    # use which@2's callback API; a bump to which@7 timed them out — #5; chalk is pinned to
    # the chalk host's own release, 6.0.1, and ora to 9.4.1, each the control for our façade
    # of it). The hosts and their suite dependencies move only through the re-vendor flow
    # (compat-refresh.yml), never through a version bump here.
    ignore:
      # `typescript-eslint` declares `typescript: ">=4.8.4 <6.1.0"` — no release of that
      # line supports TypeScript 7, so a grouped bump to 7.x fails ERESOLVE on every job
      # in the matrix before a test runs. Proposed and reverted by hand three times
      # (#5, #31). Drop this entry when typescript-eslint ships a TS 7 peer range.
      - dependency-name: "typescript"
        versions: [">=6"]
      # next 16.4.x is no longer ignored (D-20261025-next-16-4-1-security). Every 16.4 release's
      # Turbopack production build is OOM-killed on the docs apps (#1088, #1148, #1181, #1210),
      # and 16.3.8 carries GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr and GHSA-p3m5-59mp-jv5r,
      # fixed only in 16.4.1. The docs apps now build with `next build --webpack`, which builds
      # 16.4.1 in about half of 16.3.8's Turbopack memory, so a 16.4 patch is proposed again
      # (#1205 was the last proposal declined, D-20261020-dependabot-rejected-bumps).
      # react and js-yaml skip exact releases only: the next release of each is proposed again.
      # react 19.3.1: controlroom's W1–W4 weigh and time against ink + react on both sides,
      # so react moves only in a PR that re-records them.
      - dependency-name: "react"
        versions: ["19.3.1"]
      - dependency-name: "react-dom"
        versions: ["19.3.1"]
      # js-yaml 5.5.0 reports non-printable characters at a new position (its #801), and
      # seniority's `yaml.test.ts` pins js-yaml's own error text, `(1:5)`.
      - dependency-name: "js-yaml"
        versions: ["5.5.0"]
      # fumadocs 16.17.x after .1: fumadocs-mdx's peer keeps 16.17.1 at the root, the lock carries
      # two copies, and the front-door docs app fails prerendering `/` ("FrameworkProvider").
      # 16.17.5 failed in #1148/#1181; 16.17.4 was re-proposed in #1210. The cause is the peer,
      # not one release, so the line after .1 is skipped until fumadocs-mdx widens it.
      - dependency-name: "fumadocs-core"
        versions: [">16.17.1 <16.18.0"]
      - dependency-name: "fumadocs-ui"
        versions: [">16.17.1 <16.18.0"]
      - dependency-name: "commander"
      - dependency-name: "yargs"
      - dependency-name: "yargs-parser"
      - dependency-name: "which"
      - dependency-name: "mocha"
      - dependency-name: "chai"
      - dependency-name: "chalk"
      - dependency-name: "ora"
      - dependency-name: "get-stream"
      - dependency-name: "log-update"
      - dependency-name: "terminal.js"
      - dependency-name: "wcwidth"
      - dependency-name: "cross-spawn"
      - dependency-name: "cpr"
      - dependency-name: "hashish"
      - dependency-name: "yargs-test-extends"
      # Hosts vendored after the list above was written. Each one is declared at the release
      # compat-oracle vendors and grades (vendor/<name>/.source.json), and nothing ignored them.
      # #593 then proposed boxen 8.0.1 → 9.0.0, which would have moved the flagstaff/boxen ÷
      # boxen weight gate onto a release whose suite compat-oracle does not grade.
      - dependency-name: "boxen"
      - dependency-name: "cosmiconfig"
      - dependency-name: "exit-hook"
      - dependency-name: "restore-cursor"
      - dependency-name: "terminal-link"
      # B4's incumbents, pinned *exactly* in benchmarks/package.json by PLAN 3.5/3.1 (#339).
      # A weight ratio only means something if the release we weigh against is the release
      # whose own suite we pass — `slice-ansi` sat at 7.1.2 while npm had 9 for that reason, and
      # moved to 9.0.1 with its re-vendored suite (#317). #333 bumped it to 9.0.0 in a grouped
      # PR, which would have silently re-pointed the comparison at a version compat-oracle
      # did not grade. Like the hosts above, these move
      # only through the re-vendor flow, and the two sides move together.
      - dependency-name: "string-width"
      - dependency-name: "wrap-ansi"
      - dependency-name: "slice-ansi"
      - dependency-name: "strip-ansi"
      - dependency-name: "ansi-escapes"
      # cli-table3 0.6.5 is the release compat-oracle vendors and grades (vendor/cli-table3/.source.json),
      # and since 2026-09-23 the one B4 weighs flagstaff/table and flagstaff/cli-table3 against.
      - dependency-name: "cli-table3"
      # tinyexec 1.3.1 is bellpull R8's ceiling (GAPS A10, D-160): B4 weighs `bellpull`'s `run`
      # against its `x`. No suite of its is graded, so the pin is the release the ceiling was
      # measured against, and it moves only when somebody re-measures the pair on purpose.
      - dependency-name: "tinyexec"
      # cac 7.0.0 is the published weight and cold-start target (`lighter-than-cac`,
      # `cold-start-at-or-below-cac`, docs/vs/cac). No suite of its is graded, so, like tinyexec,
      # the pin is the release the claims were measured against. #1088 proposed 7.0.1, which
      # moved cac's bundle 10,452 → 10,542 B and the published 2.323× with it, a ratio change
      # nobody decided. It moves only when somebody re-measures the claims on purpose.
      - dependency-name: "cac"
      # @clack/prompts 1.8.1 is the release compat-oracle vendors and grades (vendor/clack), and
      # B5 times caique/clack against it (D-20260929-b5-runtime-ratchets): a runtime ratio against
      # a release whose suite we do not pass would compare two different contracts.
      - dependency-name: "@clack/prompts"
      # ink 6.8.0 is the release compat-oracle grades controlroom/ink against (vendor/ink), and
      # controlroom's W1–W4 weigh and time the drop-in against it; @inkjs/ui 2.0.0 is its
      # vendored release. React and the reconciler are not pinned: the docs apps share them,
      # and both sides of every W row load the same copy.
      - dependency-name: "ink"
      - dependency-name: "@inkjs/ui"
      # foundation-claims-watched R6: B4 weighs `seniority/lilconfig`, `seniority/dotenv` and
      # `closeout/signal-exit` against the releases compat-oracle grades them by (`suiteDeps` in
      # compat-oracle's hosts.ts), so each moves with its re-vendor, not on its own.
      - dependency-name: "lilconfig"
      - dependency-name: "dotenv"
      - dependency-name: "signal-exit"
      # supports-color-drop-in R4: B4 weighs `roundel/supports-color` against supports-color
      # 11.0.0, the release compat-oracle grades (`suiteDeps`), and the root pins the same one
      # for the type-surface and differential tests.
      - dependency-name: "supports-color"
      # colour-facades R4: B4 weighs `roundel/yoctocolors` against yoctocolors 2.2.0, the release
      # compat-oracle grades (`suiteDeps`), and the root pins the same one for the type-surface and
      # differential tests.
      - dependency-name: "yoctocolors"
      # inquirer-prompts-drop-in: compat-oracle grades `caique/inquirer/prompts` against
      # `@inquirer/prompts` 8.7.3 (`suiteDeps`, its ten prompts pinned by
      # D-20261019-inquirer-prompts-pins-its-prompts), and the root pins the same release for the
      # type-surface and require-shape locks. It moves with a re-vendor, never by a bump here.
      - dependency-name: "@inquirer/prompts"
  # The `claude` binary bench.yml (B1) and evals.yml install with `npm ci`. It was
  # `npm install --global` with no version, which Scorecard flags as unpinned (#34, #81);
  # the lockfile pins it, and this entry is what keeps the pin from going stale.
  - package-ecosystem: "npm"
    directory: "/.github/tools/claude-code"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    # CodeQL refuses to run when init, autobuild and analyze are on different releases
    # ("Loaded a configuration file for version X, but running version Y"). Bumped one PR per
    # sub-action, #592 and #690 each moved `init` alone and broke Analyze on main; one group
    # moves all three together.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
