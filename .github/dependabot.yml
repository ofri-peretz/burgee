# Weekly grouped dependency PRs, one at a time. Ported from ofri-peretz/eslint.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-packages:
        patterns: ["*"]
    # compat-oracle runs commander's and yargs' *own* test suites, vendored at a pinned
    # release, against their own devDependencies at that release (yargs' integration tests
    # use which@2's callback API; a bump to which@7 timed them out — #5; chalk is pinned to
    # the chalk host's own release, 6.0.0, and ora to 9.4.1, each the control for our façade
    # of it). The hosts and their suite dependencies move only through the re-vendor flow
    # (compat-refresh.yml), never through a version bump here.
    ignore:
      # `typescript-eslint` declares `typescript: ">=4.8.4 <6.1.0"` — no release of that
      # line supports TypeScript 7, so a grouped bump to 7.x fails ERESOLVE on every job
      # in the matrix before a test runs. Proposed and reverted by hand three times
      # (#5, #31). Drop this entry when typescript-eslint ships a TS 7 peer range.
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "commander"
      - dependency-name: "yargs"
      - dependency-name: "yargs-parser"
      - dependency-name: "which"
      - dependency-name: "mocha"
      - dependency-name: "chai"
      - dependency-name: "chalk"
      - dependency-name: "ora"
      - dependency-name: "get-stream"
      - dependency-name: "log-update"
      - dependency-name: "terminal.js"
      - dependency-name: "wcwidth"
      - dependency-name: "cross-spawn"
      - dependency-name: "cpr"
      - dependency-name: "hashish"
      - dependency-name: "yargs-test-extends"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
