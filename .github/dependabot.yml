# Weekly grouped dependency PRs, one at a time. Ported from ofri-peretz/eslint.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-packages:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
