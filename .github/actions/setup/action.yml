# Composite action: standard repo setup for CI jobs. Ported from
# ofri-peretz/eslint/.github/actions/setup, trimmed to what this repo has.
#
# Caller must run `actions/checkout` first. Layered caching, fastest-first:
#   1. node_modules keyed on package-lock.json — skips `npm ci` on hit.
#   2. ~/.npm (via setup-node).
#   3. .turbo task cache (opt-out with turbo-cache: "false").
#   4. (opt-in) apps/docs/.next/cache.
#
# Node version comes from .nvmrc — single source of truth.

name: Setup
description: Install Node from .nvmrc, hydrate npm + Turbo caches, run `npm ci` (skipped on cache hit).

inputs:
  turbo-cache:
    description: Restore + save the Turborepo task cache. "false" for jobs that don't run turbo.
    required: false
    default: "true"
  next-cache:
    description: Restore + save apps/docs/.next/cache. "true" for jobs that build the docs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node (from .nvmrc)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Restore node_modules cache
      id: node-modules-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --fund=false

    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-

    - name: Restore Next.js build cache
      if: inputs.next-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: apps/docs/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/docs/**/*.[jt]s', 'apps/docs/**/*.[jt]sx', 'apps/docs/**/*.mdx') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          nextjs-${{ runner.os }}-
