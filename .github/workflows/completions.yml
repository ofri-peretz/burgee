# commander-completions D4 — every generated script is exercised by its shell, not read
# by a parser: bash through COMP_WORDS, zsh through a real TAB in a pseudo-terminal, fish
# through `complete -C`, PowerShell through TabExpansion2. ubuntu-latest ships bash, zsh
# and pwsh; fish is installed here. The same test file runs locally and skips a shell that
# is not installed, so this job is where all four are guaranteed to run.
name: Completions · four shells

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: completions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shells:
    name: bash, zsh, fish, pwsh complete the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # ubuntu-latest ships bash and pwsh; zsh and fish are installed here.
      #
      # `update` reads only Ubuntu's own sources. The runner image also carries
      # third-party lists — Google Chrome's among them — and on 2026-09-09 that
      # one served an index whose hash did not match, which fails `apt-get
      # update` with exit 100 and took this job down on every PR. zsh and fish
      # come from `main`/`universe`; a browser repository has no business
      # deciding whether they install.
      - name: Install zsh and fish
        run: |
          set -euo pipefail
          sudo apt-get update -q \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y -q zsh fish
      - name: Shells present
        run: |
          set -euo pipefail
          for sh in bash zsh fish pwsh; do printf '%s: ' "$sh"; command -v "$sh"; done
      - name: Build
        run: npx turbo run build --filter=burgee
      - name: Every shell exercises its script
        run: cd packages/burgee && npx vitest run src/completions.test.ts --reporter=verbose
