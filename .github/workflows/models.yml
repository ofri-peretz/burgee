# Quint models — every `.qnt` beside a spec.md is checked against its `safety` invariant by
# random simulation (20k traces × 30 steps). A model is the spec's state machine stated so a
# checker can walk the interleavings a hand-written matrix cannot enumerate.
#
# Convention: a model declares `val safety` (the conjunction of its guarantees). A model
# without one fails here, so a model cannot land unchecked. See .sdlc/JEV-AND-QUINT.md.
#
# Ceiling: simulation, not proof. `quint verify` (Apalache, exhaustive to a bound) needs a JDK
# and minutes; add it here when a model's bug would cost more than that.
name: Models · Quint

on:
  push:
    branches: [main]
    paths: ['**/*.qnt', 'packages/closeout/src/**', 'packages/flagstaff/src/ora.ts', 'packages/burgee/src/dev.ts', 'packages/burgee/src/migrate.ts', 'packages/burgee/src/migrate-majors.ts', '.github/workflows/release.yml', '.github/workflows/changesets-pr.yml', 'packages/caique/src/clack-core.ts', 'packages/caique/src/inquirer-search.ts', 'packages/seniority/src/precedence.ts', 'packages/seniority/src/plugin.ts', 'packages/seniority/src/truth-table.ts', 'packages/burgee/src/complete-dynamic.ts', '.github/workflows/models.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.qnt', 'packages/closeout/src/**', 'packages/flagstaff/src/ora.ts', 'packages/burgee/src/dev.ts', 'packages/burgee/src/migrate.ts', 'packages/burgee/src/migrate-majors.ts', '.github/workflows/release.yml', '.github/workflows/changesets-pr.yml', 'packages/caique/src/clack-core.ts', 'packages/caique/src/inquirer-search.ts', 'packages/seniority/src/precedence.ts', 'packages/seniority/src/plugin.ts', 'packages/seniority/src/truth-table.ts', 'packages/burgee/src/complete-dynamic.ts', '.github/workflows/models.yml']
  workflow_dispatch:

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUINT: npx -y @informalsystems/quint@0.33.0

jobs:
  simulate:
    name: every model holds its safety invariant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # quint fetches its Rust evaluator from GitHub's API unauthenticated, and has no token
      # option, so a busy runner IP hits the anonymous rate limit and the gate fails with no
      # model checked (#1097, 2026-10-13). The evaluator is fixed by the pinned quint version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ env.QUINT }}
      - name: safety holds
        run: |
          set -euo pipefail
          mapfile -t models < <(git ls-files '*.qnt')
          [ "${#models[@]}" -gt 0 ] || { echo "no .qnt files tracked"; exit 1; }
          for m in "${models[@]}"; do
            echo "::group::$m"
            $QUINT typecheck "$m"
            $QUINT run "$m" --invariant=safety --max-steps=30 --max-samples=20000
            echo "::endgroup::"
          done
      # migrate's gate writes in some run, so `safety` is not holding because nothing writes.
      - name: migrate preflight — some run still writes
        run: |
          if $QUINT run .sdlc/intents/migrate-preflight/preflight.qnt --invariant=writesHappen --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::preflight.qnt: writesHappen now holds — no run writes, so safety holds vacuously"
            exit 1
          fi
      # migrate's computed specifiers (migrate-dynamic-specifiers spec.md): each rejected design
      # still fails `safety`, and some run still moves a file whose computed specifier passed.
      - name: migrate dynamic specifiers — the rejected designs still fail, and literals still move
        run: |
          m=.sdlc/intents/migrate-dynamic-specifiers/dynamic.qnt
          for s in stepNoGuard stepWide stepImportsOnly stepEager; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::dynamic.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          if $QUINT run "$m" --invariant=passedNeverMoves --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::dynamic.qnt: passedNeverMoves now holds — no run moves a file with a passed computed specifier, so safety holds vacuously"
            exit 1
          fi
      # migrate's older-majors gate (migrate-older-majors spec.md): each rejected design still
      # fails `safety`, and some run still prints a move, so `safety` is not holding because none is.
      - name: migrate older majors — the rejected designs still fail, and some run still moves
        run: |
          m=.sdlc/intents/migrate-older-majors/majors.qnt
          for s in stepUnchecked stepOffByOne stepLatest stepEager stepNoDeep; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::majors.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          if $QUINT run "$m" --invariant=neverMoves --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::majors.qnt: neverMoves now holds — no run prints a move, so safety holds vacuously"
            exit 1
          fi
      # seniority's precedence and provenance (seniority spec.md, § The model): each rejected
      # design still fails `safety`, and the two witnesses still fail, so `safety` is not holding
      # because no source is ever outranked or no plugin ever wins.
      - name: seniority precedence — the rejected designs still fail, and sources still compete
        run: |
          m=.sdlc/intents/seniority/precedence.qnt
          for s in stepLastWriter stepStaleProvenance stepUnbounded stepPluginTie stepOldestFirst; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::precedence.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          for inv in neverOutranked pluginNeverWins; do
            if $QUINT run "$m" --invariant="$inv" --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::precedence.qnt: $inv now holds — safety holds vacuously"
              exit 1
            fi
          done
      - name: inquirer search — the rejected designs still fail, and some run still answers
        run: |
          m=.sdlc/intents/inquirer-prompts-drop-in/search.qnt
          for s in stepNoAbort stepEnterLoading; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::search.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          if $QUINT run "$m" --invariant=someAnswer --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::search.qnt: someAnswer now holds — no run answers, so safety holds vacuously"
            exit 1
          fi
      # An open question, pinned: Enter straight after a key answers from the list drawn for the
      # term before it, as @inquirer/search does. When this starts holding, answer it in spec.md.
      - name: inquirer search answers one edit behind (open question, see spec.md)
        run: |
          if $QUINT run .sdlc/intents/inquirer-prompts-drop-in/search.qnt --invariant=answersFromTermOnScreen --max-steps=30 --max-samples=20000; then
            echo "answersFromTermOnScreen now holds — answer the open question in .sdlc/intents/inquirer-prompts-drop-in/spec.md and drop this step"
            exit 1
          fi
      # closeout/exit-hook without the registry (closeout-at-incumbent-weight spec.md, R4): each
      # rejected design still fails `safety`, and some run still calls an async hook, so the
      # async half of `safety` is not holding because nothing reaches it.
      - name: closeout lean exit-hook — the rejected designs still fail, and some run still awaits
        run: |
          m=.sdlc/intents/closeout-at-incumbent-weight/lean.qnt
          for s in stepNoGuard stepAsyncOnSync stepNoTimer stepClearFirst; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::lean.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          if $QUINT run "$m" --invariant=asyncNeverRuns --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::lean.qnt: asyncNeverRuns now holds — no run calls an async hook, so safety holds vacuously"
            exit 1
          fi
      # What a completer is told about the line (completion-context spec.md, R1–R3): each rejected
      # reading of the words before the cursor still fails `safety`, and some line still puts a
      # failed value in `raw`, so `sameRaw` is not holding because nothing reaches it.
      - name: completion context — the rejected designs still fail, and some line still has a raw value
        run: |
          m=.sdlc/intents/completion-context/context.qnt
          for s in stepCountValues stepFoldTrailing stepFirstWins stepKeepStale stepFlagsAfterEnd; do
            if $QUINT run "$m" --step="$s" --invariant=safety --max-steps=30 --max-samples=20000 >/dev/null; then
              echo "::error::context.qnt: safety holds under $s — the model no longer distinguishes the shipped design from the one it rejects"
              exit 1
            fi
          done
          if $QUINT run "$m" --invariant=rawNeverHolds --max-steps=30 --max-samples=20000 >/dev/null; then
            echo "::error::context.qnt: rawNeverHolds now holds — no line puts a value in raw, so sameRaw holds vacuously"
            exit 1
          fi
      # An open question, pinned: closeout's late add() is silently dropped today. When the
      # code changes and this starts holding, the step fails and the question gets answered.
      - name: closeout late add() is still dropped (open question, see spec.md)
        run: |
          if $QUINT run .sdlc/intents/closeout/registry.qnt --invariant=lateAddRuns --max-steps=30 --max-samples=20000; then
            echo "lateAddRuns now holds — answer the open question in .sdlc/intents/closeout/spec.md and drop this step"
            exit 1
          fi
