# C6 — the treadmill, made visible. Weekly, re-vendor each host's own test suite at its
# latest npm release (pinned to the release tag) and re-prove both gates. If a suite
# changed, open a PR carrying the control numbers and the exact diff of tests and API
# surface against the previous record (vendor-diff.md). Deliberately NOT auto-merged: a
# moved test count is the one thing this exists to put in front of a person. The daily
# `compat-upstream` workflow opens the issue the day a release ships; this PR is the fix.
name: Compatibility · vendor refresh

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: compat-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Re-vendor the hosts' suites and re-prove the gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` cannot be read in a step's `if:`; a job-level env of the boolean can.
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.RELEASE_BOT_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build
        run: npx turbo run build --filter='./packages/*'

      - name: Re-vendor and grade the real hosts (the control)
        continue-on-error: true
        shell: bash
        run: node packages/compat-oracle/dist/bin.js --vendor --control 2>&1 | tee compat.log

      - name: Grade burgee against the refreshed suites
        continue-on-error: true
        shell: bash
        run: node packages/compat-oracle/dist/bin.js 2>&1 | tee -a compat.log

      - name: Summary
        if: always()
        run: |
          { echo '## Compatibility'; echo; echo '```'; cat compat.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A PR opened with `github.token` raises no workflow runs, so it never gets its required
      # checks and `--auto` never fires. Same credential chain as changesets-pr.yml and evals.yml.
      - name: Mint the release App's token
        id: app
        if: vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a PR if upstream moved
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT || github.token }}
          SOURCE: ${{ steps.app.outputs.token != '' && 'app' || (env.HAS_PAT == 'true' && 'pat' || 'github-token') }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain packages/compat-oracle/vendor)" ]; then
            echo "Upstream suites unchanged."; exit 0
          fi
          STAMP=$(date -u +%Y%m%d)
          BRANCH="chore/compat-vendor-$STAMP"
          TITLE="chore(compat-oracle): re-vendor upstream test suites"
          BODY='A host published a release whose suite differs from the vendored record. The control lines are the re-proven gates against the real hosts; the burgee lines are the refreshed grades; the diff below is exactly what moved. Review it; it is not auto-merged.'
          DIFF=$(cat packages/compat-oracle/vendor-diff.md 2>/dev/null || echo '_No test or surface changes recorded._')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/compat-oracle/vendor
          git commit -m "$TITLE"
          # checkout persisted `github.token` as an auth header, which would win over the URL.
          git config --unset-all http.https://github.com/.extraheader || true
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" --label skip-changeset --title "$TITLE" --body "$(printf '%s\n\n```\n%s\n```\n\n%s\n' "$BODY" "$(cat compat.log)" "$DIFF")"
          if [ "$SOURCE" = "github-token" ]; then
            echo "::warning title=PR opened with GITHUB_TOKEN::It raises no checks, so it will not auto-merge. Set RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY, or RELEASE_BOT_PAT — see .sdlc/GAPS.md C5."
          fi
