# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Affected Packages

run-name: >-
  Release${{ inputs.dry-run && ' (dry-run)' || '' }} · ${{ inputs.dist-tag || 'latest' }} · ${{ github.event_name == 'push' && github.event.head_commit.message || github.actor }}

# ─────────────────────────────────────────────────────────────────────────────
# Ported from ofri-peretz/eslint/release.yml, without the ESLint-specific dist
# integrity matrix. Fires on every push to main (normally the merge of the
# "Version Packages" PR). Three stages:
#
#   1. detect   — order the public packages dependencies-first from their package.json
#                 files (`scripts/release-order.mts`), diff each version against npm, and
#                 emit the ones to publish as an ordered `plan`.
#   2. build    — `turbo run build --filter='./packages/*'` once; upload dist/.
#      verify   — in parallel with build: wait for `Quality Gate` and `Quality (Full)
#                 Gate` to pass on this very commit. Nothing publishes otherwise.
#      native   — in parallel too, only when the plan carries oxmutate (whose rows name
#                 `nativeCores`) or a platform package, or on a dry run: `oxmutate-native.yml`
#                 builds one `oxmutate.node` per platform, smoke-loads it, uploads it.
#   3. publish  — one job walks the plan in order. Before each package it waits until every
#                 in-family dependency is on npm at the workspace's version; then
#                 `npm publish --provenance`, git tag `<name>@<version>`, GitHub Release
#                 with that version's CHANGELOG section as its notes. oxmutate ships its six
#                 native cores inside its own tarball (`binding/oxmutate.<tag>.node`, placed from
#                 the native artifacts; the publish refuses it without every one). The
#                 `oxmutate-<platform>` packages are `private` until their names exist on npm;
#                 once public they publish first, get no tag or Release of their own, and
#                 oxmutate's manifest gains `optionalDependencies` naming them
#                 (`packages/oxmutate/RELEASING.md`).
#
# Why one ordered loop and not a matrix: on 2026-09-23 (run 35822025894) the matrix leg for
# burgee@0.10.0 reached npm ~8 minutes before closeout@0.4.0 and linegauge@0.4.3, which it
# depends on, and `npm i burgee` failed until they landed. `npm run lint:workflows` refuses a
# publishing matrix, a second publishing job, or an order that is not the computed plan.
#
# Every step is idempotent, so re-running after a partial failure is safe.
#
# Auth: npm trusted publishing (OIDC) only — no npm token exists in this workflow (D-154).
# The publish job's `id-token: write` lets npm swap GitHub's OIDC token for a short-lived
# publish token scoped to one package, and npm attaches provenance. Every public package
# names this repository and `release.yml` as its trusted publisher on npmjs.com; a new
# package needs that entry (Settings → Trusted publishing) before its first release publishes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and show what would publish, without publishing."
        required: false
        type: boolean
        default: false
      dist-tag:
        description: "npm dist-tag."
        required: false
        type: choice
        options: [latest, next, beta, rc, alpha]
        default: latest

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  detect:
    name: Detect publishable packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.detect.outputs.plan }}
      count: ${{ steps.detect.outputs.count }}
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: Diff local versions vs npm, in dependency order
        id: detect
        run: |
          set -euo pipefail
          # Every public package, each after the workspace packages it depends on — computed
          # from the package.json files now, never a list kept by hand.
          order=$(node scripts/release-order.mts)
          echo "Publish order: $(jq -r 'map(.name) | join(" → ")' <<<"$order")"
          publish='[]'
          while IFS= read -r row; do
            name=$(jq -r .name <<<"$row")
            local_ver=$(jq -r .version <<<"$row")
            npm_ver=$(npm view "$name" version 2>/dev/null || echo "")
            if [ -z "$npm_ver" ]; then
              echo "🆕 $name: first release ($local_ver)"
            elif node -e "process.exit(require('semver').gt('$local_ver','$npm_ver') ? 0 : 1)"; then
              echo "📦 $name: $npm_ver → $local_ver"
            else
              echo "✅ $name: $local_ver (npm has $npm_ver)"
              continue
            fi
            publish=$(jq -c --argjson row "$row" '. + [$row]' <<<"$publish")
          done < <(jq -c '.[]' <<<"$order")
          # No release window (D-20261027-no-release-window): every version npm lacks publishes.
          echo "plan=$publish" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$publish")" >> "$GITHUB_OUTPUT"
          # oxmutate bundles the native build matrix's cores, and a platform package publishes one,
          # so either in the plan runs that matrix.
          echo "native=$(jq 'any(.[]; has("platformOf") or has("nativeCores"))' <<<"$publish")" >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history and the tags: burgee's `family-versions.json` floors each subpath at the
      # oldest release tag that exports it (migrate-pins-carry-the-drop-in).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
      - run: npx turbo run build --filter='./packages/*'
      # Turbo may have restored burgee's dist from a build that ran in a shallow, tagless
      # checkout, where every floor is the current version. Rewrite the table from this one,
      # and fail rather than ship a tagless table.
      - name: Subpath floors read from the release tags
        working-directory: packages/burgee
        run: node ../../scripts/family-versions.mjs --require-tags
      - name: Artifact gate (K4/K5) — exports exist, no maps or tests shipped, size ratchet
        run: npm run check:artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: packages/*/dist/
          if-no-files-found: error
          retention-days: 1

  # A push to main starts this workflow and the quality workflows at the same moment, so
  # before this job the publish ran beside the gates rather than after them: a commit whose
  # `Quality (Full) Gate` went red — an admin merge, a flaky re-run, a GITHUB_TOKEN merge
  # that raised no gate run at all — could still reach npm. This waits for both gates on
  # `github.sha` and answers `ok`; `publish` runs only on `ok == 'true'`.
  #
  # Chosen over `on: workflow_run` because that would move the trigger, the `github.sha`
  # and the dispatch inputs every step here reads, and a `workflow_run` fires once per
  # upstream workflow — two gates, two releases racing. A wait keeps every step idempotent
  # exactly as it was.
  #
  # A gate cancelled because a newer push to main superseded it is not a failure: that
  # push runs its own release, which publishes the same versions (detect diffs against
  # npm). So a superseded commit answers `ok=false` green, and only a gate that actually
  # failed turns this red.
  verify:
    name: Required checks passed on this commit
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      # The gate workflows' runs on this commit, for a gate cancelled before its check run existed.
      actions: read
      checks: read
      contents: read
    outputs:
      ok: ${{ steps.wait.outputs.ok }}
    steps:
      - name: Wait for Quality Gate and Quality (Full) Gate on ${{ github.sha }}
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          # The contexts branch protection requires that also run on a push to main.
          # `review` is PR-only, so it has nothing to report here.
          CHECKS: "Quality Gate|Quality (Full) Gate"
          # The workflows those gates belong to, for a gate whose run was cancelled before its
          # check run existed.
          WORKFLOWS: "quality.yml|quality-full.yml"
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — nothing publishes, so the gate is not awaited."
            exit 0
          fi
          IFS='|' read -ra names <<< "$CHECKS"
          IFS='|' read -ra workflows <<< "$WORKFLOWS"
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            pending=""; failed=""; cancelled=""
            for name in "${names[@]}"; do
              # The latest run of the check with this name on this commit, from Actions.
              state=$(gh api -X GET "repos/$GH_REPO/commits/$SHA/check-runs" -f check_name="$name" -f filter=latest \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last
                      | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
              case "$state" in
                success) ;;
                missing|queued|in_progress|waiting|pending|requested) pending+="$name ($state); " ;;
                cancelled) cancelled+="$name; " ;;
                *) failed+="$name ($state); " ;;
              esac
            done
            if [ -z "$pending" ] && [ -z "$failed" ] && [ -z "$cancelled" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "✅ ${CHECKS//|/ and } passed on $SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ -n "$failed" ]; then
              # A gate job reports `failure` when the jobs it waits on were cancelled, and a newer
              # push to main cancels them. On a superseded commit that is a skip, not a failure:
              # the newer commit's release run gates and publishes (release-verify-lock).
              head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
              if [ "$head" != "$SHA" ] && [ "$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "cancelled")] | length')" -gt 0 ]; then
                echo "ok=false" >> "$GITHUB_OUTPUT"
                echo "::notice::$SHA was superseded by $head, and its gate failed only after jobs it waits on were cancelled ($failed). The release run for the newer commit publishes."
                exit 0
              fi
              echo "::error::Refusing to publish $SHA — a required check did not pass: $failed"
              exit 1
            fi
            # Superseded while a gate is still missing or pending: keep waiting. Since #1364 a push
            # to main never cancels quality, quality-full or compat, so an older commit's gates
            # finish, and publishing it is safe (detect plans only versions npm lacks, and a newer
            # commit's run publishes anything newer). Skipping it starved releases: run 40823297761
            # on 37cefdfa skipped burgee 1.9.3 because two *other* workflows on the commit had been
            # cancelled, and both its gates passed 26 minutes later (D-20261029-release-waits-not-skips).
            # It is skipped only when a gate itself was cancelled: a cancelled check run, or its
            # workflow cancelled before the gate's check run existed (run 39247745837 on 1b0ea782).
            if [ -n "$pending" ]; then
              head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
              if [ "$head" != "$SHA" ]; then
                runs=0
                for workflow in "${workflows[@]}"; do
                  n=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$SHA&per_page=100" \
                    --jq '[.workflow_runs[] | select(.conclusion == "cancelled")] | length')
                  runs=$(( runs + n ))
                done
                if [ -n "$cancelled" ] || [ "$runs" -gt 0 ]; then
                  echo "ok=false" >> "$GITHUB_OUTPUT"
                  echo "::notice::$SHA was superseded by $head and a gate of its own was cancelled (cancelled: ${cancelled:-none}; still missing or pending: $pending; $runs gate workflow run(s) cancelled). The release run for the newer commit publishes."
                  exit 0
                fi
              fi
            fi
            if [ -n "$cancelled" ] && [ -z "$pending" ]; then
              head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
              if [ "$head" != "$SHA" ]; then
                echo "ok=false" >> "$GITHUB_OUTPUT"
                echo "::notice::$SHA was superseded by $head before its gates finished (cancelled: $cancelled). The release run for the newer commit publishes."
                exit 0
              fi
              echo "::error::Refusing to publish $SHA — a required check was cancelled on the head of main: $cancelled Re-run it, then re-run this workflow."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Gave up waiting for $pending on $SHA after 45 minutes. Re-run this workflow once they report."
              exit 1
            fi
            echo "waiting: $pending"
            sleep 30
          done

  # oxmutate's native cores, one per platform package. It builds; it never publishes — the
  # `publish` job below bundles them into oxmutate's tarball (and publishes the platform
  # packages, once they are public) in the plan's order, so the one-publishing-job rule holds. A dry run builds them even when nothing
  # native is due, which is the way to prove every leg before oxmutate's first release.
  native:
    name: Native cores
    needs: detect
    if: needs.detect.outputs.native == 'true' || inputs.dry-run == true
    permissions:
      contents: read
    uses: ./.github/workflows/oxmutate-native.yml

  # One job, one loop, in the plan's order — not a matrix. Matrix legs run in parallel and
  # cannot wait on each other, which is how burgee@0.10.0 reached npm before two of its
  # dependencies. Before each package the loop confirms every in-family dependency is
  # installable at the workspace's version: one this run published is awaited (the registry
  # can lag the publish by a few seconds), one outside the plan must already be there. A
  # package whose dependency failed is not published; unrelated packages still are, and the
  # job goes red so a re-run finishes the rest (every step is idempotent).
  publish:
    name: Publish in dependency order
    needs: [detect, build, verify, native]
    # `native` is skipped whenever nothing native is due, and a skipped need skips this job
    # unless the condition names a status, hence `!cancelled()` and the explicit `build` result.
    # A failed `native` still publishes: oxmutate, missing a core, fails its own row (as would a
    # platform package), and unrelated packages publish.
    if: >-
      !cancelled() && needs.detect.outputs.count != '0' && needs.build.result == 'success'
      && needs.verify.outputs.ok == 'true' && needs.native.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # `registry-url` is exactly npm's own trusted-publishing example, and exactly what OpenSSF
      # Scorecard's Packaging check matches (no trailing slash). setup-node writes
      # `_authToken=${NODE_AUTH_TOKEN}` with a placeholder value, which is not a credential: npm
      # authenticates through OIDC first, and no workflow names an npm token
      # (`trusted-publishing-lock.test.ts`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # docs.npmjs.com/trusted-publishers: "requires npm CLI version 11.5.1 or later and Node
      # version 22.14.0 or higher". The .nvmrc Node bundles a new enough npm today; this
      # upgrades npm only if a later pin does not.
      - name: npm CLI can publish with OIDC (npm ≥ 11.5.1, Node ≥ 22.14.0)
        run: |
          set -euo pipefail
          meets() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          node_v=$(node -p 'process.versions.node')
          meets "$node_v" 22.14.0 || { echo "::error::Node $node_v is older than 22.14.0, which npm trusted publishing requires. Raise .nvmrc."; exit 1; }
          # No fallback: a global npm upgrade there is an unpinned install, which Scorecard's Pinned-Dependencies
          # flags, and the Node .nvmrc pins already ships a new enough npm (Node 24.13 → npm 11.6.2).
          meets "$(npm -v)" 11.5.1 || { echo "::error::npm $(npm -v) predates trusted publishing (11.5.1). Raise .nvmrc to a Node that ships it."; exit 1; }
          echo "Publishing with Node $node_v and npm $(npm -v)."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: packages/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.native.result == 'success' || needs.native.result == 'failure'
        with:
          pattern: oxmutate-native-*
          path: ${{ runner.temp }}/native
      # Each artifact holds one `oxmutate.node` for the platform its name says. It goes into
      # oxmutate's tarball as `binding/oxmutate.<tag>.node` (src/native.ts loads that first), and
      # into `npm/<tag>/` for the day that platform package is public. Only this runner ever holds
      # these files: binding/*.node is gitignored, and the build job packs without them.
      - name: Native cores into oxmutate's binding/ and their platform packages
        if: needs.native.result == 'success' || needs.native.result == 'failure'
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP"/native/oxmutate-native-*/; do
            [ -d "$d" ] || continue
            platform=$(basename "$d"); platform=${platform#oxmutate-native-}
            [ -d "packages/oxmutate/npm/$platform" ] || { echo "::error::artifact for unknown platform package $platform"; exit 1; }
            mkdir -p packages/oxmutate/binding
            cp "$d/oxmutate.node" "packages/oxmutate/binding/oxmutate.$platform.node"
            cp "$d/oxmutate.node" "packages/oxmutate/npm/$platform/oxmutate.node"
            echo "binding/oxmutate.$platform.node: $(wc -c < "packages/oxmutate/binding/oxmutate.$platform.node" | tr -d ' ') bytes"
          done
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Publish, tag and release each package, dependencies first
        # No NODE_AUTH_TOKEN, by design: npm authenticates each publish through OIDC (the job's
        # `id-token: write`). `trusted-publishing-lock.test.ts` fails if an npm token returns.
        env:
          NPM_CONFIG_PROVENANCE: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
          PLAN: ${{ needs.detect.outputs.plan }}
          # How long a dependency this run just published may take to become installable.
          DEP_WAIT_SECONDS: "600"
        run: |
          # No `set -e`: one package failing must not stop an unrelated one. Every command
          # that can fail is checked where it runs.
          set -uo pipefail

          # installable NAME VERSION — the registry serves NAME@VERSION.
          installable() { npm view "$1@$2" version >/dev/null 2>&1; }

          # oidc_said LOGS_DIR — npm's last word on the OIDC token exchange. npm writes every log
          # level to its debug log, so the exchange's verbose line is there without --loglevel.
          oidc_said() {
            local line
            line=$(grep -h ' oidc ' "$1"/*.log 2>/dev/null | tail -n 1 | sed -E 's/^[0-9]+ [a-z]+ oidc //')
            echo "${line:-npm logged nothing about OIDC}"
          }

          # Scoreboard gate (cli-output-stack R13) — the stack ships no working release before
          # the engine's row is public.
          scoreboard_gate() {
            case "$1" in roundel|flagstaff|caique) ;; *) return 0 ;; esac
            case "$2" in 0.0.*) echo "reservation release, gate not applied"; return 0 ;; esac
            local url
            url=$(node -p "try{require('./.sdlc/bands/scoreboard-public.json').commanderCompatibilityPage||''}catch{''}")
            if [ -z "$url" ]; then
              echo "::error::$1@$2 refused: .sdlc/bands/scoreboard-public.json names no published commander compatibility page (cli-output-stack R13)."
              return 1
            fi
            echo "scoreboard public at $url — gate open"
          }

          # platform_manifest DIR — a package that ships platform packages (`packages/DIR/npm/*`)
          # publishes a manifest whose optionalDependencies name each public one at its version
          # (none while they are private: the cores are bundled in binding/ instead). It is
          # written here, on the runner, never committed: an optional dependency npm does not serve
          # yet breaks `npm ci` for the whole monorepo (packages/oxmutate/RELEASING.md).
          platform_manifest() {
            local sync="packages/$1/scripts/sync-platform-versions.mjs"
            [ -f "$sync" ] || return 0
            node "$sync" --publish
          }

          # bundled_cores DIR TAGS — every platform core the package bundles is in its binding/.
          # A tarball missing one installs on that platform and fails at its first mutant.
          bundled_cores() {
            local tag missing=""
            for tag in $2; do
              [ -f "packages/$1/binding/oxmutate.$tag.node" ] || missing+=" $tag"
            done
            [ -z "$missing" ] && return 0
            echo "::error::Not publishing packages/$1 without its native core for:$missing — the Native cores job did not deliver binding/oxmutate.<tag>.node for each."
            return 1
          }

          # release_one DIR NAME VERSION [PARENT] [CORES] — gate, publish (skipped when already on npm),
          # tag, GitHub Release. With PARENT it is a platform package: its file is the native core from
          # the build matrix, not dist/, and it gets no tag or Release (the parent's covers it). CORES
          # are the platform tags the package bundles in binding/.
          release_one() {
            local PKG_DIR="packages/$1" PKG_NAME="$2" PKG_VER="$3" PARENT="${4:-}" CORES="${5:-}"
            local tag_name="${PKG_NAME##*/}@${PKG_VER}" notes="$RUNNER_TEMP/notes-${1//\//-}.md"
            if [ -n "$PARENT" ]; then
              local core
              core=$(jq -r '.main // "oxmutate.node"' "$PKG_DIR/package.json") || return 1
              [ -f "$PKG_DIR/$core" ] || { echo "::error::Missing $PKG_DIR/$core — the native build for $PKG_NAME did not reach this job (see the Native cores job)."; return 1; }
            else
              [ -d "$PKG_DIR/dist" ] || { echo "::error::Missing $PKG_DIR/dist — build artifact incomplete."; return 1; }
              [ -z "$CORES" ] || bundled_cores "$1" "$CORES" || return 1
              platform_manifest "$1" || return 1
            fi
            scoreboard_gate "$PKG_NAME" "$PKG_VER" || return 1
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$PKG_DIR" && npm publish --dry-run --tag "$DIST_TAG" --access public) || return 1
              return 0
            fi
            if installable "$PKG_NAME" "$PKG_VER"; then
              echo "✅ $PKG_NAME@$PKG_VER already on npm — skipping publish."
            else
              local logs="$RUNNER_TEMP/npm-logs-${1//\//-}"
              if ! (cd "$PKG_DIR" && npm publish --tag "$DIST_TAG" --access public --provenance --logs-dir "$logs"); then
                echo "::error::npm publish $PKG_NAME@$PKG_VER failed. OIDC exchange: $(oidc_said "$logs"). If that is an auth failure, check npmjs.com → $PKG_NAME → Settings → Trusted publishing names ofri-peretz/burgee and release.yml (environment production, if one is set) with npm publish allowed."
                return 1
              fi
              echo "🔐 $PKG_NAME@$PKG_VER published with npm trusted publishing (OIDC) — this job holds no npm token. npm: $(oidc_said "$logs")."
            fi
            [ -z "$PARENT" ] || { echo "📦 $PKG_NAME@$PKG_VER is $PARENT's core for one platform — no tag or Release of its own."; return 0; }
            # The SBOM below reads the lockfile, which never lists the platform packages.
            git checkout -- "$PKG_DIR/package.json" 2>/dev/null || true
            git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null || git tag -a "$tag_name" -m "Release $tag_name" || return 1
            # A push lost here is not fatal: `gh release create` makes the tag — from `--target`,
            # the commit that was built, not main's head, which can have moved on since
            # (.sdlc/models/release-tag.qnt).
            git push origin "$tag_name" || echo "(tag already on remote)"
            # This version's section only — the whole CHANGELOG.md made every release page
            # repeat every release before it. Empty when the version has no section.
            bash scripts/changelog-section.sh "$PKG_DIR/CHANGELOG.md" "$PKG_VER" > "$notes" || return 1
            local extra=()
            [ "$DIST_TAG" = "latest" ] || extra+=(--prerelease)
            if gh release view "$tag_name" >/dev/null 2>&1; then
              echo "↻ Release $tag_name exists."
            elif [ -s "$notes" ]; then
              gh release create "$tag_name" --title "$PKG_NAME@$PKG_VER" --notes-file "$notes" --latest=false --target "$(git rev-parse HEAD)" ${extra[@]+"${extra[@]}"} || return 1
            else
              gh release create "$tag_name" --title "$PKG_NAME@$PKG_VER" --generate-notes --latest=false --target "$(git rev-parse HEAD)" ${extra[@]+"${extra[@]}"} || return 1
            fi
            attach_provenance "$PKG_NAME" "$PKG_VER" "$tag_name" || echo "::warning::$tag_name: provenance not attached to the GitHub Release (the npm publish itself is unaffected)."
            attach_sbom "$PKG_NAME" "$PKG_VER" "$tag_name" || echo "::warning::$tag_name: SBOM not attached to the GitHub Release (the npm publish itself is unaffected)."
          }

          # attach_sbom NAME VERSION TAG: a CycloneDX SBOM of what installing NAME brings in,
          # from the lockfile alone (this job runs no `npm ci`). Development, optional and
          # peer dependencies are left out, so it lists what `npm i NAME` installs. npm names
          # the monorepo root as the document's subject, so the subject is set to NAME@VERSION.
          attach_sbom() {
            local name="$1" ver="$2" tag="$3" out="$RUNNER_TEMP/${1##*/}-${2}.cdx.json"
            npm sbom --sbom-format cyclonedx --sbom-type library -w "$name" --omit dev --omit optional --omit peer --package-lock-only > "$out.raw" || return 1
            jq --arg n "$name" --arg v "$ver" '.metadata.component = ((.components[] | select(.name == $n)) // .metadata.component) | .metadata.component.version = $v' "$out.raw" > "$out" || return 1
            gh release upload "$tag" "$out" --clobber || return 1
            echo "📋 $tag: CycloneDX SBOM attached."
          }

          # attach_provenance NAME VERSION TAG — the tarball npm serves, and the SLSA provenance npm
          # signed with Sigstore at publish (`--provenance`), on the GitHub Release. Nothing new is
          # signed: this republishes the registry's own attestation where release tooling and
          # OpenSSF Scorecard's Signed-Releases check look for it. Verify with
          # `npm audit signatures` or `cosign verify-blob-attestation --bundle <tgz>.sigstore.json`.
          #
          # npm signs the attestation after the publish returns, and it can take minutes: at
          # 12 x 10 s, linegauge@1.0.0 got no Release assets and they were attached by hand. It
          # now waits up to ATTEST_WAIT_SECONDS (10 minutes), backing off 10, 20, 40 s, then
          # every 60 s. Giving up stays a warning: the npm publish itself is already done.
          attach_provenance() {
            local name="$1" ver="$2" tag="$3" dir url waited=0 pause=10
            dir=$(mktemp -d)
            until url=$(npm view "$name@$ver" dist.attestations.url 2>/dev/null) && [ -n "$url" ]; do
              if [ "$waited" -ge "${ATTEST_WAIT_SECONDS:-600}" ]; then
                echo "::warning::$name@$ver: npm had published no attestation after ${waited}s."
                return 1
              fi
              sleep "$pause"; waited=$((waited + pause)); pause=$((pause * 2 > 60 ? 60 : pause * 2))
            done
            (cd "$dir" && npm pack "$name@$ver" --silent >/dev/null) || return 1
            local tgz
            tgz=$(ls "$dir"/*.tgz) || return 1
            curl -fsSL "$url" -o "$dir/attestations.json" || return 1
            jq -e '.attestations[] | select(.predicateType | startswith("https://slsa.dev/provenance/")) | .bundle' "$dir/attestations.json" > "$tgz.sigstore.json" || return 1
            jq -c '.dsseEnvelope' "$tgz.sigstore.json" > "$tgz.intoto.jsonl" || return 1
            gh release upload "$tag" "$tgz" "$tgz.sigstore.json" "$tgz.intoto.jsonl" --clobber || return 1
            echo "🔏 $tag: tarball, Sigstore bundle and in-toto provenance attached."
          }

          echo "Credential: npm trusted publishing (OIDC) through this job's id-token: write — no npm token (D-154)."
          # Read up front: nothing inside the loop may consume the plan from stdin.
          rows=()
          while IFS= read -r row; do rows+=("$row"); done < <(jq -c '.[]' <<<"$PLAN")
          planned=" $(jq -r 'map(.name) | join(" ")' <<<"$PLAN") "
          done_=" "; failed=" "
          for row in ${rows[@]+"${rows[@]}"}; do
            name=$(jq -r .name <<<"$row"); ver=$(jq -r .version <<<"$row"); dir=$(jq -r .dir <<<"$row")
            parent=$(jq -r '.platformOf // ""' <<<"$row"); cores=$(jq -r '(.nativeCores // []) | join(" ")' <<<"$row")
            echo "::group::$name@$ver"
            blocked=""
            deps=()
            while IFS= read -r dep_row; do deps+=("$dep_row"); done < <(jq -r '.deps[] | "\(.name) \(.version)"' <<<"$row")
            for dep_row in ${deps[@]+"${deps[@]}"}; do
              read -r dep dep_ver <<<"$dep_row"
              if [[ "$failed" == *" $dep "* ]]; then
                blocked="its dependency $dep@$dep_ver did not publish in this run"
              elif [[ "$planned" == *" $dep "* ]]; then
                if [[ "$done_" != *" $dep "* ]]; then
                  blocked="the plan lists its dependency $dep after it — the order is wrong"
                elif [ "$DRY_RUN" != "true" ]; then
                  waited=0
                  until installable "$dep" "$dep_ver"; do
                    if [ "$waited" -ge "$DEP_WAIT_SECONDS" ]; then blocked="its dependency $dep@$dep_ver is still not on npm after ${waited}s"; break; fi
                    sleep 10; waited=$((waited + 10))
                  done
                fi
              elif ! installable "$dep" "$dep_ver"; then
                blocked="its dependency $dep@$dep_ver is not on npm and this run does not publish it"
              fi
              [ -n "$blocked" ] && break
            done
            if [ -n "$blocked" ]; then
              echo "::error::Not publishing $name@$ver — $blocked."
              failed+="$name "
            elif release_one "$dir" "$name" "$ver" "$parent" "$cores"; then
              done_+="$name "
              echo "- $name@$ver" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name@$ver did not release; packages that depend on it are held back."
              failed+="$name "
            fi
            echo "::endgroup::"
          done
          if [ "$failed" != " " ]; then
            echo "::error::Not released:${failed% }. Re-run this workflow once fixed — it skips what is already out."
            exit 1
          fi
