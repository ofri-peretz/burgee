# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Control Bands

# Stage 6 — close the loop on metrics. Ported from ofri-peretz/eslint. A
# deterministic script records observations and evaluates Western Electric rules;
# no model runs in the detection path. On a 2σ+ breach it opens a PR carrying a
# Stage 1 intent, not an issue. 1σ breaches are logged only. See
# scripts/control-bands.ts and .sdlc/intents/sdlc-locks-evals-bands/.

on:
  schedule:
    - cron: "10 5 * * 1"
  workflow_dispatch:
    inputs:
      write-intent:
        description: "Open an intent PR if a band is breached"
        required: false
        type: boolean
        default: true

concurrency:
  group: control-bands
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: Watch control bands
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` cannot be read in a step's `if:`; a job-level env of the boolean can.
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.RELEASE_BOT_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build (the test-duration band times npm test on built packages)
        run: npx turbo run build --filter='./packages/*'

      - name: Record observations and evaluate bands
        id: bands
        continue-on-error: true
        shell: bash
        run: npx tsx scripts/control-bands.ts --backfill-git --write-intent --check 2>&1 | tee bands.log

      - name: Summary
        if: always()
        run: |
          { echo '## Control bands'; echo; echo '```'; cat bands.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A PR opened with `github.token` raises no workflow runs, so it never gets its required
      # checks and `--auto` never fires. Same credential chain as changesets-pr.yml and evals.yml.
      - name: Mint the release App's token
        id: app
        if: vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a PR with the new observations, and the intent if a band breached
        if: github.event_name != 'workflow_dispatch' || inputs.write-intent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT || github.token }}
          SOURCE: ${{ steps.app.outputs.token != '' && 'app' || (env.HAS_PAT == 'true' && 'pat' || 'github-token') }}
          BREACHED: ${{ steps.bands.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain .sdlc/intents/ .sdlc/bands/control-bands.history.json)" ]; then
            echo "Nothing new to commit."; exit 0
          fi
          STAMP=$(date -u +%Y%m%d)
          if [ "$BREACHED" = "true" ]; then
            BRANCH="docs/control-band-$STAMP"; TITLE="docs(workspace): control-band breach — draft intent"
            BODY='A control band was breached. The watcher wrote its diagnosis as a Stage 1 intent so the finding re-enters the pipeline (AI_NATIVE_SDLC.md). Review the intent; do not widen the band to make the breach go away.'
          else
            BRANCH="chore/control-band-series-$STAMP"; TITLE="chore(workspace): record control-band observations"
            BODY='New observations appended by `scripts/control-bands.ts --record`. No band breached. A series that stops updating looks perfectly healthy, so these landing is what keeps Stage 6 honest.'
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .sdlc/intents/ .sdlc/bands/control-bands.history.json
          git commit -m "$TITLE"
          # checkout persisted `github.token` as an auth header, which would win over the URL.
          git config --unset-all http.https://github.com/.extraheader || true
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" --label skip-changeset --title "$TITLE" --body "$(printf '%s\n\n```\n%s\n```\n' "$BODY" "$(cat bands.log)")"
          if [ "$SOURCE" = "github-token" ]; then
            echo "::warning title=PR opened with GITHUB_TOKEN::It raises no checks, so it will not auto-merge. Set RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY, or RELEASE_BOT_PAT — see .sdlc/GAPS.md C5."
          fi
          [ "$BREACHED" = "true" ] || gh pr merge --auto --squash "$BRANCH" || true

      - name: Open an issue if the watcher itself broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Control-band watcher is failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n[Run](%s)\n' 'The Stage 6 watcher did not complete, so no band was evaluated.' "$RUN_URL")
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
