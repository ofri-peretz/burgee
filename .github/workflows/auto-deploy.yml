# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Auto Deploy on Main

# ─────────────────────────────────────────────────────────────────────────────
# One merge to `main` → at most one production deploy per affected docs app.
# Ported from ofri-peretz/eslint; `.sdlc/intents/docs-deploy/intent.md` is the
# intent, `.sdlc/intents/docs-per-package/` made it one matrix over the table.
#
# WHICH APPS: turbo's affected workspaces, intersected with the `workspace` of
# every row in `.github/vercel-apps.json`. The table is the only mapping from a
# workspace to an app — there is no `case "$ws" in …` here to keep in lockstep
# with it, which is the duplication the sibling eslint repo carries and this
# file exists not to. Adding a package's site adds a row; this file is unchanged.
#
# Why turbo-affected and not a path filter: a path filter under-fires the day an
# app gains a workspace dependency, and the miss is silent — the site simply
# stops matching the code. `turbo run build --filter=...[<sha>]` walks the
# dependency graph instead. Every app devDepends on the package it documents
# and on the shared chassis, so a change to either reaches it.
#
# What that does NOT buy today — measured on this repo, not assumed. The ROOT
# workspace devDepends on several packages, so a change to any of them puts the
# root package in turbo's changed set, and turbo then reports every workspace
# changed — every docs app among them. `--filter=<ws>[<sha>]`,
# `--filter=...<ws>[<sha>]` and `--affected` all report the same, so there is no
# tighter turbo expression to switch to; the only fix is to the root
# devDependencies, which are there for their own reasons (D-059 accepts the
# redundant deploys). A change outside the workspace graph (scripts/**, the
# root README) deploys nothing.
#
# So the guarantee here is narrower than "deploys only the sites that changed",
# and `.sdlc/intents/docs-deploy/intent.md` records it as unmet rather than met:
# most product merges deploy every site, a change outside the workspace graph
# deploys none, and no ref other than `main` can deploy at all.
# `scripts/deploy-lock.test.ts` pins the `if:` that carries the last of those.
#
# Two deploys of one host never overlap: deploy-docs.yml holds one concurrency
# group per app, which both this dispatch and a hand-fired run land in. This
# file deliberately holds NO such group itself — a waiting job in that group
# would be the pending run GitHub cancels when a third arrives, silently
# dropping this merge's deploy.
#
# Why this is not itself the deploy: `deploy-docs.yml` owns the credential, the
# build and the post-deploy check. This workflow only decides *whether*. It
# passes `approval=RELEASE_APPROVAL` because the merged PR was the human gate
# (constraint 2); a deploy fired by hand still has to type it.
#
# Not in scope: per-branch previews stay forbidden — a preview needs an
# explicit `environment=preview` dispatch. Package publishes are release.yml's.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  affected:
    name: Compute turbo-affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # turbo needs history reaching the previous main commit to diff.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - id: compute
        name: Compute affected workspaces vs ${{ github.event.before }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          TABLE=.github/vercel-apps.json

          # No usable diff base — deploy every app, rather than silently skip.
          # `before` is all-zeros on a branch creation, and unreachable after a
          # force-push that rewrote history past our fetch.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "::notice::No usable diff base (BEFORE_SHA=$BEFORE_SHA) — deploying every docs app to be safe."
            echo "apps=$(jq -c '.apps | keys_unsorted' "$TABLE")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--dry-run=json` emits one entry per (workspace × task);
          # `...[<sha>]` selects each changed workspace AND every dependent.
          AFFECTED=$(npx --no turbo run build --filter="...[$BEFORE_SHA]" --dry-run=json | jq -r '.tasks[]?.package' | sort -u)
          echo "Affected workspaces:"
          echo "$AFFECTED" | sed 's/^/  /'

          # Exact string equality against each row's `workspace` — never a
          # substring match, under which one workspace name would match every
          # workspace whose name merely starts with it.
          APPS=$(jq -c --argjson ws "$(printf '%s\n' "$AFFECTED" | jq -R . | jq -sc .)" \
            '[.apps | to_entries[] | select(.value.workspace as $w | $ws | index([$w])) | .key]' "$TABLE")

          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Dispatch decision: $APPS"

  deploy:
    name: Dispatch deploy-docs.yml · ${{ matrix.app }} (production)
    needs: affected
    if: needs.affected.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One app's failed dispatch must not cancel another's.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    permissions:
      actions: write # dispatch deploy-docs.yml via `gh workflow run`
    steps:
      - name: Fire deploy-docs.yml (production)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-docs.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f app=${{ matrix.app }} \
            -f environment=production \
            -f ref=${{ github.sha }} \
            -f approval=RELEASE_APPROVAL
