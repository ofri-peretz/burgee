# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labels

run-name: >-
  Labels · PR #${{ github.event.pull_request.number }} · ${{ github.event.action }} ${{ github.event.label.name }}

# ─────────────────────────────────────────────────────────────────────────────
# A label changed after a pull request was opened, carried to the required checks that read it.
#
# The required-check workflows do not start on `labeled`/`unlabeled` any more. A label event there
# was a second run, and a second check suite, on the same head commit: `gh pr create --label`
# raised `opened` plus one `labeled` per label in the same second, concurrency cancelled all but
# one, and branch protection reads a required context from the NEWEST suite that carries it — which
# on #1418 was the cancelled one, so the PR sat BLOCKED with everything green.
#
# This file is the one place a label event lands. It reports no required check, and for any label
# but the two below it runs no job. For those it dispatches the workflows that read the label on
# the PR's branch: a run created after the PR's own, which nothing on the PR cancels, so it is the
# newest suite and its verdict is the one that counts.
#
#   skip-changeset  added or removed → changesets-pr.yml with `version-pr-check`, which runs only
#                   `Changeset present` and reads the labels live. Removing it can turn it red.
#   run-full-ci     added → quality-full.yml, compat.yml, codeql.yml. A dispatch runs each in full,
#                   which is what the label asks for. Removing it changes nothing to re-run.
#
# A label applied while the PR is opened (`gh pr create --label`) is already in the `opened` run:
# on #1418 and #1429 the `opened` run read `skip-changeset`, applied a second after the PR. So a
# `labeled` event within 30 s of the PR's creation is not dispatched again. A fork's branch cannot
# be dispatched; there the step says so, and a push or a re-run picks the label up.
#
# scripts/pr-trigger-lock.test.ts holds every label a required-check workflow reads to an arm here.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]

# One label's events on one PR in order; a third event replaces the one still waiting. Never
# cancelled mid-run: a dispatch half-sent is worse than one sent twice.
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Re-run the checks a label changes
    if: github.event.label.name == 'skip-changeset' || (github.event.action == 'labeled' && github.event.label.name == 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # `gh workflow run`
    steps:
      - name: Dispatch the workflows that read this label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CREATED: ${{ github.event.pull_request.created_at }}
          UPDATED: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          case "$LABEL" in
            skip-changeset) set -- "changesets-pr.yml -f version-pr-check=true" ;;
            run-full-ci) set -- quality-full.yml compat.yml codeql.yml ;;
            *) echo "::error::no arm for $LABEL"; exit 1 ;;
          esac
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::$HEAD_REPO:$BRANCH is a fork's branch, which cannot be dispatched here. Push to it, or re-run its checks, to pick up $ACTION $LABEL."
            exit 0
          fi
          age=$(( $(date -d "$UPDATED" +%s) - $(date -d "$CREATED" +%s) ))
          if [ "$ACTION" = labeled ] && [ "$age" -lt 30 ]; then
            echo "::notice::$LABEL was applied ${age}s after the PR was opened, so the \`opened\` runs carry it; nothing to dispatch."
            exit 0
          fi
          for wf in "$@"; do
            # Word-split on purpose: an arm may carry the workflow's `-f` inputs.
            # shellcheck disable=SC2086
            gh workflow run $wf --ref "$BRANCH"
            echo "- dispatched \`$wf\` on \`$BRANCH\` ($ACTION $LABEL)" >> "$GITHUB_STEP_SUMMARY"
          done
