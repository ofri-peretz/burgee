# Reusable: the Claude review of a pull request, briefed by triggerlist (spec R5).
#
#   - REVIEW.md and the checklist are read from the base branch, and put back to the base version in
#     the checkout the reviewer reads, so a pull request is never reviewed by rules it wrote.
#   - The prompt carries only the checklist items the diff fires, and the previous round's findings
#     (the last comment from the reviewer that carries the triggerlist marker).
#   - The review records the head SHA it was given; after it, the job fails when the head moved, so
#     a result for an old head is reported stale, never green.
#
# Callers:
#
#   jobs:
#     review:
#       uses: ofri-peretz/burgee/.github/workflows/review.yml@main
#       with:
#         preamble: You are reviewing a pull request in <repo>. Prioritise ...
#       secrets: inherit
#
# Without CLAUDE_CODE_OAUTH_TOKEN (forks, or before the secret is wired) the job passes and says
# it did not review. A merge_group entry or a dispatched run passes without a review: the code was
# reviewed on its pull request.
name: Claude review (reusable)

on:
  workflow_call:
    inputs:
      preamble:
        description: What the repository is and what the reviewer prioritises; the brief follows it.
        type: string
        required: true
      model:
        type: string
        default: claude-sonnet-4-6
      checklist:
        type: string
        default: .sdlc/checklist.yaml
      review:
        type: string
        default: REVIEW.md
      reviewer-login:
        description: The account whose marked comments are earlier rounds; anyone else's are ignored.
        type: string
        default: claude[bot]
      triggerlist-ref:
        description: The burgee ref triggerlist is built from. burgee passes its base SHA, so a pull request cannot change the tool that briefs its own review.
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Is there anything to review, and a token to review it with?
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::A queue entry is code that was already reviewed on its pull request. The job reports green so the queue can drain."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::A dispatched run has no pull request to review."
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set."
          fi

      - name: Checkout the pull request's head
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: REVIEW.md and the checklist as the base has them
        if: steps.token.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW: ${{ inputs.review }}
          CHECKLIST: ${{ inputs.checklist }}
        run: |
          set -euo pipefail
          for file in "$REVIEW" "$CHECKLIST"; do
            if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$file"
            fi
          done

      - name: Checkout triggerlist
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ofri-peretz/burgee
          ref: ${{ inputs.triggerlist-ref }}
          path: .triggerlist
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .triggerlist/.nvmrc
          cache: npm
          cache-dependency-path: .triggerlist/package-lock.json

      - name: Build triggerlist
        if: steps.token.outputs.present == 'true'
        working-directory: .triggerlist
        run: |
          npm ci --ignore-scripts
          npx turbo run build --filter=triggerlist...

      - name: The brief
        if: steps.token.outputs.present == 'true'
        id: brief
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: ${{ inputs.reviewer-login }}
          REVIEW: ${{ inputs.review }}
          CHECKLIST: ${{ inputs.checklist }}
          TRIGGERLIST_REF: ${{ inputs.triggerlist-ref }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.user.login == \"$REVIEWER\") | {body}" | jq -s . > "$RUNNER_TEMP/comments.json"
          triggerlist=.triggerlist/packages/triggerlist/dist/bin.js
          if node "$triggerlist" --schema | jq -e '.commands[] | select(.name == "brief")' > /dev/null; then
            node "$triggerlist" brief "$BASE_SHA" --head "$HEAD_SHA" \
              --checklist "$CHECKLIST" --review "$REVIEW" --comments "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/brief.md"
          else
            # The triggerlist at triggerlist-ref predates `brief` (the pull request that adds it, or a caller
            # pinned to an older ref): review with the base REVIEW.md and what `match` fires, and no earlier round.
            echo "::notice title=No triggerlist brief::triggerlist at ${TRIGGERLIST_REF} has no brief command; the prompt carries the base REVIEW.md and the fired items only."
            {
              echo "The rules below are $REVIEW as the base branch has it."
              echo
              git show "$BASE_SHA:$REVIEW" 2>/dev/null || echo "The base branch has no $REVIEW yet."
              echo
              node "$triggerlist" match "$BASE_SHA" --checklist "$CHECKLIST" || true
            } > "$RUNNER_TEMP/brief.md"
          fi
          delimiter="BRIEF_$(openssl rand -hex 12)"
          { echo "text<<$delimiter"; cat "$RUNNER_TEMP/brief.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          { echo '## Review brief'; echo; cat "$RUNNER_TEMP/brief.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Claude Code Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ inputs.preamble }}

            Be precise and low-noise: post a finding only with file:line and the
            reason. Inline comments for issues, one top-level summary.

            ${{ steps.brief.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: The review is of the head
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          triggerlist=.triggerlist/packages/triggerlist/dist/bin.js
          if node "$triggerlist" --schema | jq -e '.commands[] | select(.name == "stale")' > /dev/null; then
            node "$triggerlist" stale "$HEAD_SHA" "$current"
          elif [ "$HEAD_SHA" != "$current" ]; then
            echo "stale: this review is of $HEAD_SHA, and the head is now $current. fix: the run on $current reviews it"
            exit 1
          fi
