# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL

# Static security analysis, ported from ofri-peretz/eslint. Runs on the
# "promote" gate (non-draft PR or `run-full-ci` label), on every commit that
# lands on main, and weekly. Findings land under Security → Code scanning.
#
# `push: main` is not redundant with the PR gate. Scorecard's SAST check reads
# *commits*, not pull requests, and scored this 9/10 on "26 of 30 commits are
# checked" — the four it could not see are the ones that reached main without a
# PR run it could attribute (alert #28). The `gate` job below already lets a
# non-`pull_request` event through, so this trigger needs nothing else.

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]] || [[ "$IS_DRAFT" == "false" ]] || [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (javascript-typescript)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:javascript-typescript"
