# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL

# Static security analysis, ported from ofri-peretz/eslint. Runs on the
# "promote" gate (non-draft PR or `run-full-ci` label), on every commit that
# lands on main, and weekly. Findings land under Security → Code scanning.
#
# `push: main` is not redundant with the PR gate. Scorecard's SAST check reads
# *commits*, not pull requests, and scored this 9/10 on "26 of 30 commits are
# checked" — the four it could not see are the ones that reached main without a
# PR run it could attribute (alert #28). The `gate` job below already lets a
# non-`pull_request` event through, so this trigger needs nothing else.
#
# That reasoning was half right. Scorecard (checks/raw/sast.go) takes each of the last
# 30 commits' *merged PR* and looks for a code-scanning check run on the PR's head SHA;
# a squash merge's commit on main is never a PR head, so this run keeps main's alerts
# current but moves the score not at all. What did move it was missing here: `opened`
# and `reopened`. Without them a PR opened ready for review, with every commit already
# pushed and no label added, raised no CodeQL run: #624, #629 and #632 merged that way,
# unanalysed (21 of 30 on 2026-09-27). quality-full.yml has listed both from the start.
# The other six of the nine were PRs opened with GITHUB_TOKEN (Version PRs, the bench
# series), which raise no runs of any kind until a release App or PAT is set (GAPS C5).

on:
  pull_request:
    branches: [main]
    # No `labeled`/`unlabeled`: a label event is a second run, and a second check suite, on the same
    # head commit. Its cancelled twin can be the newer suite, which branch protection reads, and the
    # PR sits BLOCKED with everything green (#1418). A label added at `gh pr create` is in the
    # `opened` run; one changed later reaches it through pr-labels.yml, which re-runs this run.
    # scripts/pr-trigger-lock.test.ts.
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  # A required check (`CodeQL`), and a required check with no `merge_group:` trigger never
  # reports inside a merge queue: the entry neither merges nor fails (required-checks-lock).
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  # Pushes to main are never cancelled: Scorecard's SAST check counts each merged commit.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # `pull-requests: read`: a step below reads the `run-full-ci` label back live.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The label read back live: a re-run from pr-labels.yml keeps the event it re-runs, and a
          # label added since is not in it (pr-trigger-lock). The event's value stands if the read fails.
          if [ -n "$PR_NUMBER" ] && live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "run-full-ci")'); then HAS_LABEL=$live; fi
          if [[ "$EVENT_NAME" != "pull_request" ]] || [[ "$IS_DRAFT" == "false" ]] || [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (javascript-typescript)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:javascript-typescript"
