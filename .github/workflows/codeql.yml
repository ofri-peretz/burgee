# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL

# Static security analysis, ported from ofri-peretz/eslint. Runs on the
# "promote" gate (non-draft PR or `run-full-ci` label), on every commit that
# lands on main, and weekly. Findings land under Security → Code scanning.
#
# `push: main` is not redundant with the PR gate. Scorecard's SAST check reads
# *commits*, not pull requests, and scored this 9/10 on "26 of 30 commits are
# checked" — the four it could not see are the ones that reached main without a
# PR run it could attribute (alert #28). The `gate` job below already lets a
# non-`pull_request` event through, so this trigger needs nothing else.
#
# That reasoning was half right. Scorecard (checks/raw/sast.go) takes each of the last
# 30 commits' *merged PR* and looks for a code-scanning check run on the PR's head SHA;
# a squash merge's commit on main is never a PR head, so this run keeps main's alerts
# current but moves the score not at all. What did move it was missing here: `opened`
# and `reopened`. Without them a PR opened ready for review, with every commit already
# pushed and no label added, raised no CodeQL run: #624, #629 and #632 merged that way,
# unanalysed (21 of 30 on 2026-09-27). quality-full.yml has listed both from the start.
# The other six of the nine were PRs opened with GITHUB_TOKEN (Version PRs, the bench
# series), which raise no runs of any kind until a release App or PAT is set (GAPS C5).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  # Pushes to main are never cancelled: Scorecard's SAST check counts each merged commit.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]] || [[ "$IS_DRAFT" == "false" ]] || [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (javascript-typescript)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
