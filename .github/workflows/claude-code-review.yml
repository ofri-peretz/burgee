name: Claude Code Review

# AI code review on pull requests, through the reusable review.yml (triggerlist R5):
# REVIEW.md and the checklist come from the base branch, the prompt carries only the
# checklist items the diff fires and the previous round, and a review whose head moved
# fails as stale. triggerlist is built from the base SHA, so a pull request cannot change
# the tool that briefs its own review. It no-ops green until CLAUDE_CODE_OAUTH_TOKEN
# exists.
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. `claude setup-token` locally
#   3. Add the token as the repo secret CLAUDE_CODE_OAUTH_TOKEN

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Required check — see the note in quality.yml. It reports green without reviewing
  # anything here; the reviewing happened on the pull request this entry came from.
  merge_group:
  # Dispatched on `changeset-release/main` by changesets-pr.yml's GITHUB_TOKEN fallback,
  # because a PR GITHUB_TOKEN opens raises no `pull_request` run. The Version PR is
  # changesets' own bookkeeping — version fields and CHANGELOG lines generated from
  # changesets that were reviewed on their own PRs — so it reports green without a review.
  workflow_dispatch:

concurrency:
  # `github.event.pull_request.number` is empty on a `merge_group` event, so on its own it
  # collapses every queue entry into one group and `cancel-in-progress` has them cancel each
  # other. The ref is unique per entry.
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      triggerlist-ref: ${{ github.event.pull_request.base.sha || github.sha }}
      preamble: |
        You are reviewing a pull request in the Interlace CLI repo: extensions
        for commander and yargs that give CLIs a machine-readable, agent-friendly
        floor. Read README.md and .sdlc/intents/burgee/spec.md
        for the floor requirements (F/O/E/V/S/P/D/T ids) and honour them.

        Prioritise, in order:
        1. Correctness & security — real bugs, broken edge cases, regressions,
           injection through argv/env/config, secrets in output.
        2. Floor conformance — a change that adds a command, option, error or
           output path must keep every requirement it touches (cite the id).
        3. Regression locks — a fix with no test that fails on the unfixed code.
        4. Host idiom — extensions use commander/yargs public APIs, never fork or
           re-parse argv.
    secrets: inherit
