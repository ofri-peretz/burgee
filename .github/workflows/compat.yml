# The compatibility scoreboard: its gates on every pull request, the whole matrix every night.
#
#   ratchet — C5: each host's own suite against burgee; falling below the recorded baseline
#             fails. Runs where the baselines were recorded (Linux, the .nvmrc Node).
#             C1: the same, for each incumbent's previous major (`--majors`).
#   matrix  — C3: every Node LTS in `engines` × Linux, macOS, Windows. Our own suite is a
#             hard gate everywhere; the controls are informational off Linux, because the
#             hosts' suites are themselves OS-sensitive and a baseline recorded on one OS
#             is not a contract for another.
#   floor   — C3 for the two `engines` floors, the published suites only.
#
# Heavy work does not run during CI/CD (D-20261101-heavy-ci-runs-nightly). A pull request and a
# merge-queue entry get the ratchet and the three Node 24 `matrix` cells — all four are REQUIRED
# checks on `main` (2026-11-01), so they must report on every PR. The off-Linux controls
# (informational) and the `floor` cells (the published suites on Node 20.19 and 22.13) run
# nightly at 03:30 UTC, on a dispatch, and on a PR labelled `run-full-ci`. Measured over the last
# runs before the change: a PR started 13 jobs, about 92 job-minutes; a push to `main` 13 jobs,
# about 103. A push to `main` no longer runs this file at all — release.yml waits on `Quality
# Gate` and `Quality (Full) Gate`, never on it — and a failed night opens an issue: the ratchet from
# its own step, the matrix and floor cells from nightly-report.yml, which no pull request starts.
# `scripts/heavy-ci-nightly-lock.test.ts` holds both halves: the required names report on a PR,
# and the heavy cells do not start there.
#
# On a pull request the `matrix` cells run only the affected packages: each one the PR changed
# and each one that depends on one, from `scripts/affected.mts` (D-20261012-ci-affected-pr-lanes).
# A PR that changes no package still starts every cell, and each says so in one step and passes.
# The schedule, the merge queue, a dispatch and the `run-full-ci` label run everything, as do
# root changes (workflows, the lockfile, root configs, `scripts/`). The ratchet is never
# filtered: it grades every host, and the scoreboard is the product.
name: Compatibility

on:
  pull_request:
    # No `labeled`/`unlabeled`: a label event is a second run, and a second check suite, on the same
    # head commit. Its cancelled twin can be the newer suite, which branch protection reads, and the
    # PR sits BLOCKED with everything green (#1418). A label added at `gh pr create` is in the
    # `opened` run; one changed later reaches it through pr-labels.yml, which re-runs this run.
    # scripts/pr-trigger-lock.test.ts.
    types: [opened, reopened, synchronize]
  # No `push:` (D-20261101-heavy-ci-runs-nightly). The nightly run grades `main` in full, and a red
  # night opens an issue the way a red push did.
  schedule:
    - cron: "30 3 * * *"
  # `ratchet` is a REQUIRED context as of this change. A merge queue builds
  # `refs/heads/gh-readonly-queue/...` and waits for the required checks to report on
  # THAT event; without this trigger the check never reports and the entry sits in the
  # queue forever with no error. `scripts/lint-workflows.ts` enforces the pairing.
  merge_group:
  # `os` and `node` pick one cell (windows-lane-holds R1): measuring one Windows cell ten times
  # should not cost ten full matrices. Left at `all`, a dispatch runs everything, as before —
  # the Version PR's fallback (changesets-pr.yml) dispatches with no inputs and gets the ratchet.
  workflow_dispatch:
    inputs:
      os:
        description: Run only this OS's cells (the ratchet is skipped when a cell is picked)
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, windows-latest]
      node:
        description: Run only this Node's cells (24 is `matrix`, 20.19.0 and 22.13.0 are `floor`)
        type: choice
        default: all
        options: [all, '24', '20.19.0', '22.13.0']

# A push to main ran to the end, in a group of its own (as codeql.yml does), while this file still
# ran on one: release.yml publishes a commit only once its required gates pass, and a newer merge
# cancelling them left every release deferring to the next commit (oxmutate 1.0.1, 2026-10-29).
# The group is kept so a push trigger added back inherits it. Pull requests cancel superseded runs;
# the nightly and dispatched runs on main do not.
concurrency:
  group: compat-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ratchet:
    name: Ratchet · each host's suite against burgee
    # A dispatch that picks a cell is a measurement of that cell, not a grade.
    if: ${{ (!inputs.os || inputs.os == 'all') && (!inputs.node || inputs.node == 'all') }}
    runs-on: ubuntu-latest
    # 30, not 20: ink 8's suite is 1,309 cases run one file at a time with 78 of them in a
    # PTY, measured at 268 s for the control and 115 s for the drop-in on darwin, and ink 6.8
    # is now graded as a previous major too — about six minutes more than the 10.5 this job
    # took before it (D-20261006-controlroom-ink-8), with repeat-and-agree re-runs on top.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # the broken-main reporter below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build
        id: build
        run: npx turbo run build --filter='./packages/*'
      - name: Grade burgee (fails below baseline)
        shell: bash
        run: node packages/compat-oracle/dist/bin.js 2>&1 | tee compat.log
      # Both halves, in the one job that can hold them: `results.json` from the grade
      # above and `results.control.json` from here. The control's numbers are the Linux
      # ones — yargs scores 814 / 816 here and 816 / 816 on the other runners — so this is
      # the only place the committed page can be compared against a measurement.
      - name: Grade the real packages, so the page has its control column
        shell: bash
        run: node packages/compat-oracle/dist/bin.js --control 2>&1 | tee -a compat.log
      # C1 — each drop-in against its incumbent's OLDER major, graded by that major's own
      # suite (`PREVIOUS_MAJORS` in hosts.ts: commander 14, yargs 17). Same ratchet, same
      # control, same Linux runner as the two steps above, and before the page check because
      # the page carries these rows. `SUPPORTED_MAJORS` in burgee's compat.ts claims an older
      # major only when this grades it level; `scripts/supported-majors-lock.test.ts` holds that.
      - name: Grade burgee against the previous majors (C1, fails below baseline)
        shell: bash
        run: node packages/compat-oracle/dist/bin.js --majors 2>&1 | tee -a compat.log
      - name: Grade the previous majors' real packages
        shell: bash
        run: node packages/compat-oracle/dist/bin.js --majors --control 2>&1 | tee -a compat.log
      # The page went stale in silence once: `flagstaff/cli-table3` was graded 29 / 29 and
      # the published table went on saying `flagstaff/table` 0 / 29, because the number was
      # measured, merged, and never regenerated. `bench:page` has had this check since it
      # was written; this is the same check on the other generated page.
      - name: The published page is the one these results generate
        run: npm run compat:page -- --check
      # The same check on /docs/weight, which is measured from this build's `dist/`. Its own
      # lock only asked that every subpath have a row, so #1139 added 5 B to every commander
      # entry and the page, and the `OVER_INCUMBENT` ratchet read from it, kept the old number.
      # It compares every line but the generation stamp. About 40 s of esbuild.
      - name: The published weight page is the one this build generates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run weight:page -- --check
      - name: Summary
        if: always()
        run: |
          { echo '## Compatibility'; echo; echo '```'; cat compat.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: compat-results
          path: packages/compat-oracle/results.json
          if-no-files-found: ignore
          retention-days: 30

      # This job going red on main used to notify nobody. On 2026-09-10 it failed on the
      # #197 merge at 14:44 and main stayed red until #199 — noticed only because #191,
      # #195 and #198 all went red on a job none of them had touched, which reads as
      # three broken PRs rather than one broken main.
      #
      # Making the check REQUIRED is the fix for the merge; this is the fix for
      # everything that gets in another way — an admin merge, a re-run that flips, an
      # upstream host suite changing under a green PR. A red main is an outage, so it is
      # an issue and not a finding. Dedup by title, so a run of red nights opens one and comments.
      # Since D-20261101-heavy-ci-runs-nightly it grades main nightly rather than on each push, so
      # the issue names the night's head, not the merge that did it.
      - name: Say so — a red main is an outage
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="main is red — the nightly compatibility ratchet failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf 'The nightly ratchet failed on main at `%s`, so main is broken now and every branch cut from it inherits it. The merge that did it is one of those since the last green night.\n\nMost likely the published `compatibility.mdx` no longer matches what the oracle measures — rebuild, run `packages/compat-oracle/dist/bin.js --control` then without flags, then `npm run compat:page`, and commit the page.\n\n[Run](%s)\n' "$SHA" "$RUN_URL")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

  # The packages `matrix` and `floor` run, computed once for both (`scripts/affected.mts`). The
  # script reads the event itself: anything but a pull request, or the `run-full-ci` label,
  # selects everything. `packages` is a JSON array of names under `packages/`; `full` is true
  # when everything was selected, and the cells then run exactly what they ran before.
  affected:
    name: Affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pull-requests: read`: a step below reads the `run-full-ci` label back live.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.set.outputs.full }}
      packages: ${{ steps.set.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: The affected set
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --base "$BASE")
          # The label read back live: a re-run from pr-labels.yml keeps the event it re-runs, and a
          # label added since is not in it (pr-trigger-lock). The event's value stands if the read fails.
          if [ -n "$PR_NUMBER" ] && live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "run-full-ci")'); then FULL=$live; fi
          if [ "$FULL" = true ]; then args+=(--full); fi
          set_json=$(node scripts/affected.mts "${args[@]}")
          echo "$set_json"
          echo "full=$(jq -c .full <<<"$set_json")" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c .packages <<<"$set_json")" >> "$GITHUB_OUTPUT"

  # Every OS on every pull request: `Node 24 · ubuntu-latest`, `· macos-latest` and
  # `· windows-latest` are required checks, and a required check that never reports blocks every
  # merge. Their informational controls (below) are what moved to the night.
  matrix:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    needs: affected
    # Skipped only by a dispatch that picked a `floor` Node; never on a pull request.
    if: ${{ !inputs.node || inputs.node == 'all' || inputs.node == '24' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FULL: ${{ needs.affected.outputs.full }}
      PACKAGES: ${{ needs.affected.outputs.packages }}
      # Every suite that spreads `timeouts` writes each case's duration and timeout here
      # (windows-lane-holds R1); the last two steps upload it and name the cases past half.
      VITEST_DURATIONS_DIR: ${{ github.workspace }}/vitest-durations
      # The five-second per-case budget is held once, by Quality (Full)'s Unit Tests and the
      # pre-push hook (D-20261101-tests-under-5s); these cells grade correctness on every OS, and
      # the half-timeout report above names their slow cases.
      VITEST_CASE_BUDGET_MS: "0"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        # The active LTS only (D-20261020-node-26-waits-for-lts). 26 is Current until its LTS
        # promotion; it rejoins as `[24, 26]` the day it becomes Active LTS, not before.
        node: [24]
    steps:
      # Every cell starts and reports, so a PR that changes no package is green here, not absent.
      - name: No package affected — nothing to run on this cell
        if: env.PACKAGES == '[]'
        run: echo "This pull request changes no package and no file every package consumes; the ratchet and the locks still run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PACKAGES != '[]'
      # The shared setup action pins Node from .nvmrc; a matrix needs the version varied,
      # so this job installs Node directly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: env.PACKAGES != '[]'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
        if: env.PACKAGES != '[]'
      # Same `turbo run build`, the same 24 tasks with the same hashes, on every cell. On
      # macOS it runs two tasks at a time instead of turbo's default ten. macos-latest has
      # three cores, and ten concurrent `next build`s (every docs app) oversubscribe them:
      # each app's Turbopack compile took 14–24 minutes instead of ~20 s, the step took
      # ~16 minutes at the median and 25 on a bad run, and this job sat at its 30-minute
      # timeout. Measured on one commit, one runner type, 2026-09-27 (run 36354199521):
      # concurrency 10 → 1503 s, 4 → 220 s, 2 → 152 s, the task list and hashes identical
      # across all three. Linux and Windows have four cores and run four: at turbo's default ten,
      # ubuntu runners died mid-build with exit 137 and "received a shutdown signal" (9 of 25
      # Quality (Full) runs, 2026-10-06), the shape of ten `next build`s running out of memory.
      # `scripts/turbo-concurrency-lock.test.ts` holds every unfiltered build to a cap.
      - run: npm run build -- --concurrency=${{ matrix.os == 'macos-latest' && '2' || '4' }}
        if: env.FULL == 'true'
      # npm appends the flag to the script's last command, `turbo run test`. Linux runs four;
      # Windows and macOS run two. At the default ten, Windows' Node 26 cell failed 2 of 10 runs
      # on timing alone, each time a different test: vendor-run, ink-alias, completions.
      - name: Our suite (hard gate on every cell)
        if: env.FULL == 'true'
        run: npm test -- --concurrency=${{ matrix.os == 'ubuntu-latest' && '4' || '2' }}
      # A pull request's subset. Every package is built, not only the affected ones, and no docs
      # app: a suite may import a package it does not declare (the `coverage` job's rule in
      # quality-full.yml, from #827). Then the repository's locks and each affected suite.
      # The root suite runs whole and starts the built demo (`clispec-document`, `mcp-config-block`),
      # so the demo is built too: without it every PR that moved no package's source went red here
      # (#1143, #1145, #1155). `scripts/root-suite-build-scope-lock.test.ts` holds the two together.
      - name: Build every package and the demo the root suite runs (affected subset)
        if: env.FULL != 'true' && env.PACKAGES != '[]'
        run: npx turbo run build --filter='./packages/*' --filter=demo-cli-burgee --concurrency=${{ matrix.os == 'macos-latest' && '2' || '4' }}
      - name: Our suite, affected packages only (hard gate on every cell)
        if: env.FULL != 'true' && env.PACKAGES != '[]'
        shell: bash
        run: |
          set -euo pipefail
          echo "Affected: $PACKAGES"
          npx vitest run --config vitest.root.config.ts
          # A read loop: macOS runs bash 3.2, which has no bash-4 builtins (bash3-workflow-lock).
          # The step only runs with PACKAGES non-empty, so the array is never empty under set -u.
          filters=()
          while IFS= read -r f; do filters+=("$f"); done < <(node -p "JSON.parse(process.env.PACKAGES).map((n) => '--filter=' + n).join('\\n')")
          npx turbo run test "${filters[@]}" --concurrency=${{ matrix.os == 'ubuntu-latest' && '4' || '2' }}
      # The controls grade the real packages through compat-oracle, so only it can move them.
      # On Linux they are a gate and run here; off Linux they are informational and run in the
      # `controls` job below, so they do not spend this cell's 30 minutes.
      - name: Controls (gate on Linux)
        if: matrix.os == 'ubuntu-latest' && (env.FULL == 'true' || contains(fromJSON(env.PACKAGES), 'compat-oracle'))
        run: node packages/compat-oracle/dist/bin.js --control --progress
      # cli-foundation-stack Y4: has this Node absorbed a foundation layer? Each layer's vectors
      # against the builtin it composes, alone (`scripts/absorption-probe.ts`). Reported, never
      # gated: a count that rises on a new LTS opens an intent to deprecate that layer on
      # purpose. Every package is built above, so it runs whenever the cell does.
      - name: Absorption probe — the builtins alone, on this Node (informational)
        if: always() && env.PACKAGES != '[]'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --no tsx scripts/absorption-probe.ts | tee -a "$GITHUB_STEP_SUMMARY"
      # windows-lane-holds R1, R2: the per-case durations, kept whatever the cell's verdict, and the
      # cases above half their timeout named in the summary. Informational until the cases
      # intent names are fixed; then the half-budget check becomes a gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vitest-durations-${{ github.job }}-${{ matrix.os }}-node${{ matrix.node }}
          path: vitest-durations
          if-no-files-found: ignore
          retention-days: 30
      - name: Cases above half their timeout (informational)
        if: always() && hashFiles('vitest-durations/*.json') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { echo '## Cases above half their timeout'; echo; echo '```'; node scripts/slow-cases.mts vitest-durations; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Controls off Linux, informational, in a job of their own. In the `matrix` cell they were
  # half the Windows job: 542–883 s of 17 m 35 s – 28 m 28 s over ten dispatched runs at
  # `b62cf2a105` (D-20261028-windows-pinned-sha-counts), and the slowest run ended 92 s from the
  # cancel. Here a slow host costs only this job; the graded cell keeps its build and its suite.
  # The same OSes and Node as `matrix`; only the packages are built, which is all
  # compat-oracle reads (the ratchet builds the same). `scripts/off-linux-controls-lock.test.ts`.
  controls:
    name: Controls · Node ${{ matrix.node }} · ${{ matrix.os }} (informational)
    needs: affected
    # Off-Linux cells only, so nightly, dispatched, or on a `run-full-ci` PR — never a plain PR.
    if: >-
      ${{ (!inputs.node || inputs.node == 'all' || inputs.node == '24') && inputs.os != 'ubuntu-latest'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
      && (needs.affected.outputs.full == 'true' || contains(fromJSON(needs.affected.outputs.packages), 'compat-oracle')) }}
    runs-on: ${{ matrix.os }}
    # Measured without ink (D-20261027-windows-controls-ink): ~9 min on macOS, ~13.5 on Windows,
    # 15 at the worst of the ten; install and build add ~2.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["macos-latest","windows-latest"]') }}
        node: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx turbo run build --filter='./packages/*' --concurrency=${{ matrix.os == 'macos-latest' && '2' || '4' }}
      # `--progress` names each host as it starts: a stall says which host.
      - name: Controls (informational off Linux)
        continue-on-error: true
        run: node packages/compat-oracle/dist/bin.js --control --progress

  # C3 for the lower half of `engines` (D-132). The nine published packages declare
  # `^20.19.0 || >=22.13.0`; the job above covers 24, this one the two floors,
  # exact — a floor is only a claim if the floor itself is what runs. 20.19 and 22.13 are
  # where `require(esm)` loads without a warning, which is what K2's CommonJS promise needs.
  #
  # Built once on the .nvmrc Node, because that is the Node the release builds on and the
  # dist npm ships is what a Node 20 or 22 user runs. The workspace tooling (root tests,
  # compat-oracle, docs) stays on 24 — its `engines` says so — so only the published
  # suites run here. Hard gate on every cell, the same policy as `matrix`.
  #
  # Nightly, on a dispatch, and on a PR labelled `run-full-ci` (then only the affected published
  # packages; every package is still built). Six cells of 2–5 minutes each, about 21 job-minutes a
  # run (D-20261101-heavy-ci-runs-nightly).
  floor:
    name: Node ${{ matrix.node }} · ${{ matrix.os }} · published suites
    needs: affected
    # Skipped by a dispatch that picked a `matrix` Node, and on a pull request without the label.
    if: >-
      ${{ (!inputs.node || inputs.node == 'all' || inputs.node == '20.19.0' || inputs.node == '22.13.0')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-full-ci')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PACKAGES: ${{ needs.affected.outputs.packages }}
      VITEST_DURATIONS_DIR: ${{ github.workspace }}/vitest-durations
      # Held by Quality (Full)'s Unit Tests, not here, as in `matrix` above (D-20261101-tests-under-5s).
      VITEST_CASE_BUDGET_MS: "0"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: ['20.19.0', '22.13.0']
        exclude: ${{ fromJSON(inputs.node == '20.19.0' && '[{"node":"22.13.0"}]' || inputs.node == '22.13.0' && '[{"node":"20.19.0"}]' || '[]') }}
    steps:
      - name: No package affected — nothing to run on this cell
        if: env.PACKAGES == '[]'
        run: echo "This pull request changes no package and no file every package consumes; the ratchet and the locks still run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PACKAGES != '[]'
      - uses: ./.github/actions/setup
        if: env.PACKAGES != '[]'
      - name: Build on the .nvmrc Node — the dist npm ships
        if: env.PACKAGES != '[]'
        run: npx turbo run build --filter='./packages/*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: env.PACKAGES != '[]'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Every affected published package's suite (hard gate on every cell)
        if: env.PACKAGES != '[]'
        shell: bash
        run: |
          set -uo pipefail
          node --version
          failed=()
          for dir in packages/*/; do
            name=$(basename "$dir")
            [ "$(node -p "require('./${dir}package.json').private === true")" = true ] && continue
            [ "$(node -p "process.env.PACKAGES.includes(JSON.stringify(require('./${dir}package.json').name))")" = true ] || continue
            echo "::group::$name"
            (cd "$dir" && npx vitest run) || failed+=("$name")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::red on Node $(node --version): ${failed[*]}"; exit 1; fi
      # windows-lane-holds R1, R2: the per-case durations, kept whatever the cell's verdict, and the
      # cases above half their timeout named in the summary. Informational until the cases
      # intent names are fixed; then the half-budget check becomes a gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vitest-durations-${{ github.job }}-${{ matrix.os }}-node${{ matrix.node }}
          path: vitest-durations
          if-no-files-found: ignore
          retention-days: 30
      - name: Cases above half their timeout (informational)
        if: always() && hashFiles('vitest-durations/*.json') != ''
        continue-on-error: true
        # This cell's Node is a floor (20.19, 22.13), which does not strip types; tsx does.
        shell: bash
        run: |
          set -o pipefail
          { echo '## Cases above half their timeout'; echo; echo '```'; npx --no tsx scripts/slow-cases.mts vitest-durations; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # No `heavy-tests` job: the NIGHTLY_ONLY cases (scripts/vitest-case-budget-reporter.ts) each run
  # oxmutate end to end, and no mutation runs in GitHub Actions (D-20261101-no-mutation-in-gha).
  # `npm run mutation:weekly` runs them with BURGEE_NIGHTLY set, before the full mutation runs.
