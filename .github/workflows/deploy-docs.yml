# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Docs

# ─────────────────────────────────────────────────────────────────────────────
# The only path that ships a docs app. Ported from ofri-peretz/eslint, trimmed
# to what this repo has. `.sdlc/intents/docs-deploy/intent.md` is the intent;
# `.sdlc/intents/docs-per-package/` made it one workflow for N apps.
#
# WHICH APP is the `app` input, validated against `.github/vercel-apps.json` —
# the one file that names every app, its Vercel project, its host and its build.
# Nothing about any app is written in this file: adding a package's site is a
# row in that table and an app directory, never an edit here
# (`scripts/vercel-apps-lock.test.ts` fails if an app key, directory, host or
# project id appears under .github/workflows/).
#
# Manual-only by construction. `vercel.json` (repo root — see the deploy job) sets
# `git.deploymentEnabled: false`, so Vercel never deploys on a push, and this
# workflow has no `push:` / `pull_request:` trigger — constraint 1 of the
# intent, and `scripts/deploy-lock.test.ts` fails if either changes.
#
# INERT UNTIL THE OWNER ACTS. With no `VERCEL_TOKEN` secret the preflight job
# says exactly what is missing and every later job is skipped: the run is green
# and nothing is deployed. Nothing else in CI depends on it. The moment the
# secret exists the same file deploys, with no second PR — the pattern of #47.
#
# Required, owner-created: VERCEL_TOKEN (https://vercel.com/account/tokens), a
# REPOSITORY secret. It is the only one. The team id and each project id are
# public identifiers and live in the table, not in secrets — N per-app secrets
# would be N things to add, rotate and get wrong for values that are not secret.
# ─────────────────────────────────────────────────────────────────────────────

run-name: >-
  Deploy Docs · ${{ inputs.app }} · ${{ inputs.environment }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      app:
        # A string, not a `choice`: a fixed options list would be a second copy of the
        # table. No default, for the same reason — a default names an app. Preflight
        # refuses a key the table does not have and lists the ones it does.
        description: "App key from .github/vercel-apps.json."
        required: true
        type: string
      environment:
        description: "Target environment."
        required: true
        type: choice
        options: [preview, production]
        default: preview
      ref:
        description: "Git ref to deploy (default: this workflow's checkout — main for production)."
        required: false
        default: ""
      approval:
        description: "Type RELEASE_APPROVAL to confirm a production deploy. Ignored for preview."
        required: false
        default: ""

concurrency:
  # ONE group per app, whoever fired the run. A hand-fired deploy and the one
  # auto-deploy.yml dispatches for the same merge used to sit in different groups
  # (this one was keyed on the ref, and the two pass different refs for the same
  # commit), so both ran at once and the second alias move made the first run's
  # read-back see a build that was not its own: run 35816373791 failed "serving
  # build b0c0c9c…, not 2dc573f… The deploy uploaded but the alias did not move".
  # Every deploy of one host now queues behind the last; two apps still deploy in
  # parallel. auto-deploy.yml only dispatches this workflow, so this group is the
  # one both paths share — `scripts/deploy-lock.test.ts` pins it.
  group: docs-deploy-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # ── Is there anything to deploy with, and is anyone allowed to? ────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      org_id: ${{ steps.app.outputs.org_id }}
      project_id: ${{ steps.app.outputs.project_id }}
      production_url: ${{ steps.app.outputs.production_url }}
      root_directory: ${{ steps.app.outputs.root_directory }}
      build_command: ${{ steps.app.outputs.build_command }}
      output_directory: ${{ steps.app.outputs.output_directory }}
    steps:
      # Only the table is needed here; the full checkout happens in the deploy job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/vercel-apps.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      # The row is the whole of what this run knows about the app. An unknown key
      # fails here, loudly, before a credential is even looked at — `jq -e` exits
      # non-zero on null, which is the difference between refusing a typo and
      # deploying one with every field empty.
      - id: app
        name: Resolve the app
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          TABLE=.github/vercel-apps.json
          ROW=$(jq -ec --arg app "$APP" '.apps[$app]' "$TABLE") || {
            echo "::error::No app '$APP' in $TABLE. Known: $(jq -r '.apps | keys | join(", ")' "$TABLE")"
            exit 1
          }
          {
            echo "org_id=$(jq -er '.orgId' "$TABLE")"
            echo "project_id=$(jq -er '.projectId' <<< "$ROW")"
            echo "production_url=$(jq -er '.productionUrl' <<< "$ROW")"
            echo "root_directory=$(jq -r '.rootDirectory' <<< "$ROW")"
            echo "build_command=$(jq -er '.buildCommand' <<< "$ROW")"
            echo "output_directory=$(jq -er '.outputDirectory' <<< "$ROW")"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved '$APP': $(jq -r '.productionUrl + " (" + .dir + ")"' <<< "$ROW")"

      - id: check
        name: Check credentials and approval
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail

          # ─── No credential → no-op, not a failure ───────────────────────
          # A red X here would be a standing false alarm on a repo that has
          # simply not been given a token yet.
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set — nothing was deployed. This is the expected state until the Vercel project exists."
            {
              echo "# ⏸ Deploy Docs · no-op"
              echo
              echo "\`VERCEL_TOKEN\` is not set on this repository, so there is nothing to deploy with."
              echo
              echo "**What happens when it exists.** This same workflow, unchanged, will:"
              echo
              echo "1. \`vercel pull\` the \`${ENVIRONMENT}\` environment for the project;"
              echo "2. \`vercel build\` it with \`NEXT_PUBLIC_BUILD_SHA\` set to the deployed commit;"
              echo "3. \`vercel deploy --prebuilt\` it;"
              echo "4. read \`<meta name=\"x-build-sha\">\` back off the deployed URL and fail if it is not that commit."
              echo
              echo "Add \`VERCEL_TOKEN\` under Settings → Secrets and variables → Actions. It is the only secret: the team and project ids come from \`.github/vercel-apps.json\`."
              echo
              echo "> **It must be a _repository_ secret, not an _environment_ secret.** This job"
              echo "> declares no \`environment:\`, so a secret scoped to a \`<app>-production\` or"
              echo "> \`<app>-preview\` environment is invisible here and every run would stay green"
              echo "> and inert forever — the failure this summary exists to make impossible."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ─── Production is gated; the gate is a typed string ─────────────
          # Constraint 2 of the intent: a production deploy fired by hand
          # stops for a human. `auto-deploy.yml` passes this, because the PR
          # that merged was the human. A GitHub Environment with required
          # reviewers (Settings → Environments → <app>-production) turns this
          # refusal into a real pause; the job below already declares it.
          if [ "$ENVIRONMENT" = "production" ] && [ "${APPROVAL:-}" != "RELEASE_APPROVAL" ]; then
            echo "::error::Production deploy refused: type RELEASE_APPROVAL in the 'approval' field to confirm. (auto-deploy.yml passes it for you on a merge to main.)"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ inputs.app }} (${{ inputs.environment }})
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write # GitHub Deployments API records the deploy URL
    environment:
      # One per app (D-060): a reviewer approving a deploy sees which site it is.
      # Auto-created on first use. Add required reviewers here to make a
      # production deploy pause rather than merely be gated on the string.
      name: ${{ inputs.app }}-${{ inputs.environment == 'production' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ needs.preflight.outputs.org_id }}
      VERCEL_PROJECT_ID: ${{ needs.preflight.outputs.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_URL: ${{ needs.preflight.outputs.production_url }}
    # No `defaults.run.working-directory`: the Vercel CLI runs at the REPO ROOT.
    # Root Directory on every project is unset (the repo root), so `vercel.json`
    # lives there and that is where the CLI has to run.
    #
    # This was `working-directory: <the app>`, and the first real production
    # deploy died on it: `File does not exist: "node_modules/client-only/
    # index.js"`. This is an npm-workspaces monorepo, so the runtime files Next
    # traces are hoisted to the ROOT `node_modules` — outside the app — and a
    # prebuilt upload rooted at the app cannot contain them. The root is the only
    # directory that sees both the app and the dependencies it traced.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          next-cache: "true" # constraint 3: the build stays under two minutes

      # `github.sha` is the commit this *workflow file* was read from, which is
      # not the commit that was checked out above: `auto-deploy.yml` dispatches
      # `--ref main -f ref=<merge sha>`, so a second merge landing in the gap
      # leaves `github.sha` ahead of `inputs.ref`. Stamping one while building
      # the other would make the post-deploy check compare a value against
      # itself and pass on a build of the wrong commit. Ask git instead.
      - name: Resolve the commit that was checked out
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Every project reads the same root `vercel.json` (Root Directory unset, see
      # above), so that file can hold only what is true for every app — and the
      # build command and output directory, which differ per app, would otherwise
      # be whatever someone last typed into the dashboard. Nine projects, one
      # config: the sibling eslint repo shipped its docs site to its registry
      # domain exactly this way. So the row is written onto the project before
      # every deploy, and the dashboard cannot drift from a reviewed file.
      - name: Self-heal Vercel project config
        env:
          ROOT_DIRECTORY: ${{ needs.preflight.outputs.root_directory }}
          BUILD_COMMAND: ${{ needs.preflight.outputs.build_command }}
          OUTPUT_DIRECTORY: ${{ needs.preflight.outputs.output_directory }}
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg root "$ROOT_DIRECTORY" --arg build "$BUILD_COMMAND" --arg out "$OUTPUT_DIRECTORY" \
            '{rootDirectory: (if $root == "" then null else $root end), buildCommand: $build, outputDirectory: $out}')
          curl -sf -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null
          echo "Project ${VERCEL_PROJECT_ID}: $BODY"

      - name: Pull Vercel environment metadata
        run: npx vercel pull --yes --environment=${{ inputs.environment }} --token="$VERCEL_TOKEN"

      - name: Build (${{ inputs.environment }})
        env:
          # Stamped into `<meta name="x-build-sha">` by every app's root layout
          # (`docs-chassis/layout`, `rootMetadata`).
          # This is what the post-deploy check reads back.
          NEXT_PUBLIC_BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx vercel build --prod --token="$VERCEL_TOKEN"
          else
            npx vercel build --token="$VERCEL_TOKEN"
          fi

      # `--target=preview` on the preview line is NOT redundant. Git integration is off
      # for this project, so a CLI deploy has no branch to infer a preview from and the
      # CLI falls back to **production** — measured 2026-09-09: the same command without
      # the flag returned `"target": "production"` and took the project's
      # `.vercel.app` production alias, while with it the deployment came back
      # `"target": null` and stayed a Preview. Without the flag, `environment=preview`
      # silently ships production, which is the opposite of what the input says.
      #
      # `--archive=tgz` packs the prebuilt output into ONE tarball instead of
      # uploading it file by file. Vercel rejects a prebuilt deploy carrying more
      # than 15,000 files, and the count that matters is not the app's — deploying
      # from the repo root means the upload is the whole traced closure, root
      # `node_modules` included. An earlier revision of this file argued the flag
      # away on "397 files in the app's `.next`", which measured the wrong tree and was
      # written while the deploy had never once succeeded. The corpus only grows;
      # a limit you cross silently at some future merge is not a limit worth
      # discovering in production. `scripts/deploy-lock.test.ts` pins the flag on
      # both lines.
      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = "production" ]; then
            url=$(npx vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          else
            url=$(npx vercel deploy --prebuilt --archive=tgz --target=preview --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      # ─── Post-deploy check ──────────────────────────────────────────────
      # A deploy step that exits 0 proves an upload, not a serve. The failure
      # this catches is the one a green workflow cannot otherwise see: the
      # alias still pointing at the previous build. `x-build-sha` is stamped
      # at build time, so if the URL echoes this run's commit back, the bytes
      # on the CDN are the bytes we just built.
      - name: Verify the deployed URL serves this build
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail

          # Production is checked at its public host, because that alias is
          # what the success criteria are written about; a preview has no
          # host but its own.
          if [ "${{ inputs.environment }}" = "production" ]; then
            TARGET="$PRODUCTION_URL"
          else
            TARGET="$DEPLOY_URL"
          fi
          echo "Checking $TARGET for x-build-sha=$EXPECTED_SHA"

          # Vercel's CDN needs a moment to point the alias at the new build.
          #
          # `-w '%{http_code}'` prints `000` on a transport failure AND curl exits
          # non-zero, so the obvious `$(curl … || echo 000)` appends a second one
          # and yields `000000` — a code no branch below matches, which turned the
          # "DNS is not there yet" case into `returned HTTP 000000 after 5
          # attempts`. Keep the status and the exit code apart.
          CODE=000
          RC=0
          for attempt in 1 2 3 4 5; do
            RC=0
            CODE=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 "$TARGET") || RC=$?
            case "$CODE" in '' | *[!0-9]*) CODE=000 ;; esac
            [ "$CODE" = "200" ] && break
            # 6 = could not resolve host. No number of retries creates a DNS
            # record, so go straight to the soft-warn instead of burning 5×10s.
            if [ "$RC" -eq 6 ]; then
              CODE=000
              break
            fi
            echo "attempt $attempt: HTTP $CODE (curl exit $RC) — retrying"
            [ "$attempt" -eq 5 ] || sleep 10
          done

          case "$CODE" in
            200) ;;
            302|307|401|403)
              # Deployment Protection is on for this deployment. That is a
              # project setting, not a broken deploy — say so and stop.
              # 302/307 is the shape it actually takes on a *preview* URL: the
              # protection layer redirects to Vercel SSO rather than refusing
              # outright. Measured 2026-09-09 against a real preview deploy;
              # matching only 401|403 made every protected preview a hard red.
              echo "::warning::$TARGET returned $CODE — Vercel Deployment Protection is enabled, so the build cannot be verified from CI. Disable it for this project, or add a protection bypass secret."
              exit 0
              ;;
            000)
              # No HTTP response at all — almost always DNS that does not exist
              # yet, which is the state between creating a project and pointing
              # its record. The deploy itself already succeeded; do not fail on
              # it, but name the exact record that is missing rather than a bare
              # curl error, because that is the owner's one remaining step.
              HOST="${PRODUCTION_URL#https://}"
              if [ "$RC" -eq 6 ]; then
                echo "::warning::DNS for $HOST does not resolve yet, so this build could not be verified. Add the record at the registrar: A  $HOST  76.76.21.21 (Vercel). The deploy itself succeeded ($DEPLOY_URL)."
                echo "### ⚠ DNS: add \`A $HOST 76.76.21.21\`" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::$TARGET could not be reached (curl exit $RC). Expected until the DNS record for $HOST exists; the deploy itself succeeded ($DEPLOY_URL)."
              fi
              exit 0
              ;;
            *)
              echo "::error::$TARGET returned HTTP $CODE after 5 attempts."
              exit 1
              ;;
          esac

          SERVED=$(grep -o 'name="x-build-sha" content="[^"]*"' /tmp/home.html | head -1 | sed 's/.*content="//;s/"$//')
          if [ -z "$SERVED" ]; then
            echo "::error::$TARGET returned 200 but carries no <meta name=\"x-build-sha\"> — it is not serving a build of this app."
            exit 1
          fi
          if [ "$SERVED" != "$EXPECTED_SHA" ]; then
            echo "::error::$TARGET is serving build $SERVED, not $EXPECTED_SHA. The deploy uploaded but the alias did not move."
            exit 1
          fi
          echo "✅ $TARGET serves $SERVED"

      - name: Verify the agent surfaces are on the deployed build
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # The site is written for agents too (intent, "Success criteria").
          # A 200 on /llms.txt is the cheapest proof the route survived the
          # build and the deploy, not only the test suite.
          # Same `000` normalisation as the step above — see the comment there.
          # This one stays a hard failure on an unreachable target, because the
          # target is Vercel's own deployment URL and not a name we have to wait
          # for: if *that* does not answer, the deploy did not serve anything.
          TARGET="$DEPLOY_URL"
          RC=0
          CODE=$(curl -sS -o /tmp/llms.txt -w '%{http_code}' --max-time 20 "$TARGET/llms.txt") || RC=$?
          case "$CODE" in '' | *[!0-9]*) CODE=000 ;; esac
          # Same set as the step above: a protected preview answers 302 to SSO.
          case "$CODE" in
            302 | 307 | 401 | 403)
              echo "::warning::/llms.txt returned $CODE — Deployment Protection, not a broken route."
              exit 0
              ;;
          esac
          if [ "$CODE" != "200" ]; then
            echo "::error::$TARGET/llms.txt returned HTTP $CODE (curl exit $RC)."
            exit 1
          fi
          LINES=$(grep -c '^- \[' /tmp/llms.txt || true)
          if [ "${LINES:-0}" -lt 1 ]; then
            echo "::error::/llms.txt is served but lists no pages."
            exit 1
          fi
          echo "✅ /llms.txt lists $LINES page(s)"

      - name: Job summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status="${{ job.status }}"
          icon="✅"
          [ "$status" = "failure" ] && icon="❌"
          [ "$status" = "cancelled" ] && icon="⏹"
          {
            echo "# $icon Deploy Docs · ${{ inputs.app }} · ${{ inputs.environment }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App | \`${{ inputs.app }}\` → $PRODUCTION_URL |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Ref | \`${{ inputs.ref || github.ref }}\` |"
            echo "| Build SHA | \`${{ steps.sha.outputs.sha }}\` |"
            echo "| Triggered | @${{ github.actor }} |"
            echo "| Status | $status |"
            if [ -n "${URL:-}" ]; then echo "| URL | $URL |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
