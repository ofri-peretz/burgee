# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Changesets

run-name: >-
  Changesets · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'push' && 'open / refresh Version PR' || 'manual') }}

# ─────────────────────────────────────────────────────────────────────────────
# Ported from ofri-peretz/eslint/changesets-pr.yml. Two responsibilities:
#
# 1. On PR — a gate: a PR that touches `packages/*/src` or a `package.json`
#    and adds no `.changeset/*.md` FAILS, with a comment saying how to fix it.
#    It was advisory until 2026-09-09 and warned into a green tick, which is
#    how a user-visible change reaches a release with no version bump and no
#    changelog line. The deliberate override is the `skip-changeset` label,
#    which is a decision someone makes and signs rather than an omission.
#
# 2. On push to main — open / refresh the "Version Packages" PR and enable
#    auto-merge on it. Merging it triggers release.yml. No `publish:` here.
#    With no release credential configured it falls back to GITHUB_TOKEN and then
#    runs the required checks, merges and starts the release itself (`checks`,
#    `land`) — no human close-and-reopen.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open / refresh Version Packages PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      token-source: ${{ steps.source.outputs.source }}
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    env:
      # `secrets` cannot be read in a step's `if:`; a job-level env can, and a boolean of
      # it carries nothing secret.
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.RELEASE_BOT_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # ── Which credential opens the Version PR ────────────────────────────────────────
      #
      # A PR opened, or a branch pushed, with GITHUB_TOKEN raises no workflow runs —
      # GitHub's loop-prevention rule — so the Version PR sat at 0 checks against 3
      # required ones on #299, #367, #383 and #393, each unblocked by a human closing and
      # reopening it. And a merge that GITHUB_TOKEN's auto-merge performs raises no runs on
      # main either: #393 landed as 54432b9 and neither `release.yml` nor `quality.yml`
      # ran on it. So the order of preference is:
      #
      #   1. A GitHub App installation token (`vars.RELEASE_APP_ID` +
      #      `secrets.RELEASE_APP_PRIVATE_KEY`). Its pushes and PRs raise runs, it belongs
      #      to no person, and it expires in an hour.
      #   2. `secrets.RELEASE_BOT_PAT`. Same effect, but a long-lived personal credential.
      #   3. GITHUB_TOKEN — and then this workflow does the part a human used to do: the
      #      `checks` job below dispatches each required workflow on the Version PR's
      #      branch and mirrors its result onto the PR's head commit, and the `land` job
      #      merges and starts the post-merge runs itself. See those jobs for why a
      #      dispatch alone is not enough.
      #
      # `client-id` takes either the App's Client ID or its numeric App ID: both are
      # accepted as the JWT issuer, and `app-id` is the deprecated spelling of the input.
      - name: Mint the release App's token
        id: app
        if: vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Say which credential this run uses
        id: source
        env:
          APP_TOKEN_MINTED: ${{ steps.app.outputs.token != '' }}
          HAS_APP_ID: ${{ vars.RELEASE_APP_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_TOKEN_MINTED" = "true" ]; then
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo "source=github-token" >> "$GITHUB_OUTPUT"
            missing="vars.RELEASE_APP_ID=$([ "$HAS_APP_ID" = "true" ] && echo set || echo MISSING), secrets.RELEASE_APP_PRIVATE_KEY=$([ "$HAS_APP_KEY" = "true" ] && echo set || echo MISSING), secrets.RELEASE_BOT_PAT=MISSING"
            echo "::warning title=Version PR opened with GITHUB_TOKEN::No release credential is configured ($missing). A PR opened with GITHUB_TOKEN raises no workflow runs, so this workflow will dispatch the required checks itself, mirror them onto the PR, and merge it itself. Set RELEASE_APP_ID (repo variable) + RELEASE_APP_PRIVATE_KEY (repo secret), or RELEASE_BOT_PAT, to retire the fallback — see .sdlc/GAPS.md C5."
          fi

      - name: Open / refresh Version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          # Renamed by the action in v1.5.4; the old names are a hard error, not a
          # warning, so every push to main since has failed and the Version PR has
          # been frozen at whatever main looked like when it last succeeded.
          version-script: npm run changeset:version
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # The token is an INPUT, not an env var. Passing it as `env: GITHUB_TOKEN` is
          # worse than not working: the action reads `github-token` and then *throws* if
          # the environment variable is set to anything different — "Please pass the
          # custom GitHub token to the github-token input and remove the GITHUB_TOKEN
          # environment variable to avoid conflicts".
          github-token: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT || secrets.GITHUB_TOKEN }}
        env:
          # lefthook's pre-push would otherwise gate the bot's push; the real
          # gates run on the resulting Version PR.
          LEFTHOOK: "0"

      - name: Enable auto-merge on the Version PR
        # The action's outputs were renamed alongside its inputs: `hasChangesets` is now
        # `has-changesets` and `pullRequestNumber` is `pr-number`. An unknown output is the
        # empty string rather than an error, so the old spelling made this condition
        # silently false — the auto-merge and auto-approve below have never once run.
        #
        # Not under GITHUB_TOKEN: the merge auto-merge performs is attributed to whoever
        # enabled it, and a GITHUB_TOKEN merge raises no push runs — #393 merged that way
        # and nothing released it. The `land` job merges in that case, and starts the runs.
        if: >-
          steps.changesets.outputs.has-changesets == 'true' && steps.changesets.outputs.pr-number
          && steps.source.outputs.source != 'github-token'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT }}
          PR: ${{ steps.changesets.outputs.pr-number }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          # An App cannot approve the PR it opened; a PAT's user can. No review is required
          # (`required_approving_review_count: 0`), so this is a signature, not a gate.
          if [ "$SOURCE" = "pat" ]; then
            gh pr review "$PR" --approve --body "Auto-approved by changesets bot — review via the changesets that produced this PR." || \
              echo "::warning::Auto-approve failed (PAT may lack permission). Auto-merge still set."
          fi
          gh pr merge "$PR" --auto --squash || \
            echo "::warning::gh pr merge --auto returned non-zero. Is auto-merge enabled in Settings → General?"

  # ── GITHUB_TOKEN fallback, part 1: the required checks ─────────────────────────────
  #
  # A `workflow_dispatch` is the one event GITHUB_TOKEN may raise, so each workflow that
  # reports a required check is dispatched on the Version PR's branch. That is not enough
  # on its own: GitHub documents that checks from a `workflow_dispatch` run "do not
  # satisfy a required status check" even when they pass on the PR's head commit
  # (docs.github.com → Troubleshooting required status checks). The rule is about check
  # runs made by workflow jobs; a commit *status* with the same context is what branch
  # protection reads for a required context with no app pinned (`app_id: null`, which is
  # how `main` is configured). So each leg waits for its dispatched run and posts that
  # run's result — never an assumed one — as a status on the head commit, linked to the
  # run.
  #
  # One leg per workflow that reports a required check. `scripts/lint-workflows.ts`
  # fails if a workflow reports a REQUIRED_CHECKS name and has no row here, or has no
  # `workflow_dispatch:` trigger to be dispatched by.
  checks:
    name: Version PR · ${{ matrix.check }} (dispatched)
    needs: version
    if: >-
      needs.version.outputs.token-source == 'github-token'
      && needs.version.outputs.has-changesets == 'true' && needs.version.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write # gh workflow run
      statuses: write # mirror the result onto the head commit
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workflow: quality.yml, check: "Quality Gate" }
          - { workflow: quality-full.yml, check: "Quality (Full) Gate" }
          - { workflow: claude-code-review.yml, check: "review" }
          - { workflow: compat.yml, check: "Ratchet · each host's suite against burgee" }
    steps:
      - name: Dispatch ${{ matrix.workflow }} and mirror `${{ matrix.check }}`
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.version.outputs.pr-number }}
          BRANCH: changeset-release/main
          WORKFLOW: ${{ matrix.workflow }}
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          status() { # state description [target_url]
            args=(-f state="$1" -f context="$CHECK" -f description="${2:0:140}")
            [ -n "${3:-}" ] && args+=(-f target_url="$3")
            gh api -X POST "repos/$GH_REPO/statuses/$sha" "${args[@]}" >/dev/null
          }
          status pending "Dispatched $WORKFLOW (Version PR opened with GITHUB_TOKEN)"
          since=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$WORKFLOW" --ref "$BRANCH"

          # `gh workflow run` does not return the run it created; find it by head SHA.
          run=""
          for _ in $(seq 1 36); do
            run=$(gh run list --workflow "$WORKFLOW" --branch "$BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$sha\" and .createdAt >= \"$since\")] | first | .databaseId // empty")
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            status error "No $WORKFLOW run appeared for $sha — the branch may have moved; the next refresh re-dispatches"
            echo "::error::No dispatched $WORKFLOW run found for $sha."
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
          echo "Waiting on $url"
          gh run watch "$run" --interval 30 >/dev/null || true

          conclusion=$(gh run view "$run" --json jobs --jq "[.jobs[] | select(.name == \"$CHECK\")] | first | .conclusion // \"missing\"")
          if [ "$conclusion" = "success" ]; then
            status success "$CHECK passed in the dispatched $WORKFLOW run" "$url"
          else
            status failure "$CHECK: $conclusion in the dispatched $WORKFLOW run" "$url"
            echo "::error::$CHECK concluded '$conclusion' on the Version PR — $url"
            exit 1
          fi

  # ── GITHUB_TOKEN fallback, part 2: merge, then start what the merge will not ───────
  #
  # Under GITHUB_TOKEN the merge itself raises no push runs (see #393 above), so this job
  # merges only once every mirrored check is green, and then dispatches the post-merge
  # verification and the release on `main`. `release.yml` publishes only once its own
  # `verify` job sees `Quality Gate` and `Quality (Full) Gate` pass on that commit, so
  # dispatching the release beside them is safe: it waits for them.
  #
  # A merge refused here is not an error: it means `main` moved under the PR (strict
  # branch protection), and the push that moved it re-runs this workflow, which refreshes
  # the Version PR and comes back through here.
  land:
    name: Version PR · merge and start the release
    needs: [version, checks]
    if: needs.version.outputs.token-source == 'github-token' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # gh workflow run on main
      contents: write # the merge
      pull-requests: write
    steps:
      - name: Merge the Version PR and dispatch the post-merge runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.version.outputs.pr-number }}
        run: |
          set -euo pipefail
          # An auto-merge a GITHUB_TOKEN run enabled before this job existed can win the race
          # the moment the last status lands. That merge raised no runs either, so it is
          # handled exactly like ours: the post-merge runs below still have to be started.
          if ! gh pr merge "$PR" --squash; then
            if [ "$(gh pr view "$PR" --json state --jq .state)" != "MERGED" ]; then
              echo "::warning::The Version PR did not merge (main moved, or a check went red since). The next push to main refreshes it and retries."
              exit 0
            fi
            echo "#$PR was already merged — starting the post-merge runs it did not raise."
          fi
          for wf in quality.yml quality-full.yml release.yml; do
            gh workflow run "$wf" --ref main
          done
          echo "Merged #$PR; dispatched quality.yml, quality-full.yml and release.yml on main." >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changeset
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # The Version PR is the one PR that must not have a changeset: it *consumes* them.
          # It deletes every `.changeset/*.md` and edits a `packages/*/package.json` per bump,
          # which is exactly the `missing` shape below — so before this line every release
          # went red here and collected a "Changeset reminder" comment telling its author to
          # run `npm run changeset`. A red check on every release is how a team learns to
          # read red as normal. `changeset-release/main` is the branch changesets/action
          # pushes to; a human cannot reach this branch, because the action force-pushes it.
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "status=release" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo ",$LABELS," | grep -q ',skip-changeset,'; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" \
            | grep -E '^\.changeset/[^/]+\.md$' | grep -vE '^\.changeset/(README|config)\.md$' || true)
          src=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" \
            | grep -E '^packages/[^/]+/(src|package\.json)' || true)
          if [ -n "$added" ]; then echo "status=present" >> "$GITHUB_OUTPUT"
          elif [ -z "$src" ]; then echo "status=not-needed" >> "$GITHUB_OUTPUT"
          else echo "status=missing" >> "$GITHUB_OUTPUT"; echo "::warning::PR changes packages/ source but has no changeset."
          fi

      # Presence was the whole check, and presence is not validity. A changeset naming a
      # private package alongside a published one is refused by changesets itself — "Found
      # mixed changeset" — but only at version time, on main, in a different workflow. So
      # `incumbent-weights-measured` passed its PR green, merged, and left the Version
      # Packages PR unable to refresh for every push that followed. `status` is the same
      # question the release asks, asked while it is still one PR's problem.
      #
      # Only when a changeset is present: with none, `changeset status` exits 1 by design
      # ("run changeset add --empty"), which is the right answer for a release and the wrong
      # one for a `skip-changeset` PR.
      # The job checked out and installed nothing, so `npx changeset status` had no
      # changesets binary to run and exited "could not determine executable to run" —
      # a failure for every PR that HAS a changeset, which is every PR the step exists
      # for. Installing also pins the check to the repo's own changesets version rather
      # than whatever npx would fetch.
      - uses: ./.github/actions/setup
        if: steps.check.outputs.status == 'present'

      # `--since=origin/main`, as package.json's own `changeset:status` does. Bare
      # `status` asks where HEAD diverged from a local `main`, and a CI checkout is a
      # detached HEAD with no local branches: "Failed to find where HEAD diverged".
      - name: The changeset is one changesets will accept
        if: steps.check.outputs.status == 'present'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          npx changeset status --since=origin/main

      - name: Comment on PR (when missing)
        if: steps.check.outputs.status == 'missing'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- changeset-reminder -->';
            const body = `${marker}
            ### 📝 Changeset reminder

            This PR touches \`packages/*/src/**\` or a \`package.json\` but includes no
            changeset. If the change is user-visible, run \`npm run changeset\` and commit
            the resulting \`.changeset/*.md\`. For internal-only work add the
            \`skip-changeset\` label.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      # After the comment, so the PR carries the instructions before it goes red.
      - name: Fail when the changeset is missing
        if: steps.check.outputs.status == 'missing'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail
          echo "::error::This PR changes packages/ source or a package.json and adds no changeset."
          echo "Run 'npm run changeset', commit the .changeset/*.md it writes, and push."
          echo "If the change is genuinely internal, add the 'skip-changeset' label instead."
          exit 1

      - name: Report
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "changeset status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
