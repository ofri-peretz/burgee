# Repository rulesets as code: applies every `.github/rulesets/*.json` to the repositories it
# lists (scripts/apply-rulesets.mts), creating or replacing each ruleset by name.
#
# On a pull request that changes a declaration it only validates and prints the plan, so a bad
# file fails before it merges; on the push to main that lands it, and on demand, it applies.
# Applying needs RULESETS_TOKEN, a fine-grained PAT with Administration read/write on every listed
# repository; without it the run is a dry run that says so.
name: rulesets

on:
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - "scripts/apply-rulesets.mts"
      - ".github/workflows/rulesets.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - "scripts/apply-rulesets.mts"
      - ".github/workflows/rulesets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulesets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Apply rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc

      - name: Apply the declared rulesets
        env:
          RULESETS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.RULESETS_TOKEN || '' }}
        run: node scripts/apply-rulesets.mts
