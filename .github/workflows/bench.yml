# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Benchmarks

# ─────────────────────────────────────────────────────────────────────────────
# The four axes of `cli-benchmarks`, on the cadences the intent sets. Heavy work does not run
# during CI/CD (D-20261101-heavy-ci-runs-nightly): nothing here runs on a push to `main`, and a
# pull request gets only the byte-exact gates.
#
#   gate   — pull requests only: B4 weight, the reliability axis (bytes and exit codes, no clock)
#            and the N10 floor, each `--check`ed. Deterministic, so a PR can be held to them; about
#            five minutes, most of it the build. Nothing is landed from a pull request.
#   cheap  — nightly (`0 3 * * *`): B2 cold start, B3 compatibility, B4 weight, B5 runtime against
#            the incumbent, and the reliability axis, all `--check`ed, and the night's observation
#            landed on `chore/bench-series` — one a night, where every push to `main` used to land
#            one and the bot PR's own merge was the next push. Its milliseconds are a property of
#            the runner, so they gate a night, not a pull request.
#   agent  — B1 agent cost. Costs money and is noisy over short intervals, so it
#            does not run on a pull request unless one asks by name with the
#            `bench:agent` label: weekly on its own cron (`40 5 * * 2`, not the nightly one), on
#            demand, and on a labelled PR. **Not on a push to main** since 2026-10-18
#            (D-20261019-b1-weekly-not-per-push): about 25 paid runs per merge
#            drew on the same Claude weekly quota as the required `review` check
#            and froze the repository for five days. It needs
#            CLAUDE_CODE_OAUTH_TOKEN (preferred; no per-token charge) or
#            ANTHROPIC_API_KEY, and **reports skipped without one** — it never
#            reports a number it did not measure. On a scheduled run that skips,
#            it opens an issue, because a weekly benchmark that has never run is
#            the kind of thing a green tick hides for a year.
#            Its third arm, `burgee-mcp` (.sdlc/intents/b1-mcp-arm/), is the same
#            demo over `--mcp` on the tasks both surfaces can state: 3 tasks × 5
#            runs = 15 more paid runs a reading. It runs on the weekly schedule,
#            on a `bench:agent` PR, and on a manual dispatch with the `mcp-arm`
#            input set (D-20261027-b1-mcp-arm-owner-dispatch) — never on a push to
#            main or a dispatch without the input — and `ci-axes.test.ts` holds
#            that bound (R4). It stays off until the owner sets the repository
#            variable B1_MCP_ARM=approved.
#   floor  — nightly: N10, the demo graded by clispec and cli-agent-lint, its own suite
#            (`external-floor`); see the job. Its ratchet also runs in `gate` on every PR.
#   A failed night opens (or comments on) one issue, from nightly-report.yml: a job here would show
#   on every pull request as a check, whatever its `if:` says.
#
# The perf axis reports absolute milliseconds that are a property of the runner.
# Nothing gates on them: the gated number is a ratio between two spawns
# interleaved in the same run. See benchmarks/README.md, and issue #27 for what
# an absolute ceiling did to two innocent PRs.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    # `labeled` so applying `bench:agent` starts a run rather than waiting for
    # the next push: the label IS the request to spend the money.
    types: [opened, synchronize, reopened, labeled]
    # The nightly observation PR carries data and nothing else; the gate measures the build, which
    # it does not move.
    paths-ignore:
      - 'benchmarks/results/**'
  # No `push:`. Every push to `main` used to measure, land an observation and open or extend
  # `chore/bench-series`, whose merge was the next push: a bot PR every 20–30 minutes, each one
  # more CI and one more superseded release run (D-20261101-heavy-ci-runs-nightly). Without the
  # trigger that loop cannot form, whatever the landing step finds (#275–#289 were the first one).
  schedule:
    # Nightly, the first of the staggered heavy runs (compat.yml follows at 03:30).
    - cron: "0 3 * * *"
    # Weekly, B1 only. `github.event.schedule` tells the two apart in the jobs' `if:`.
    - cron: "40 5 * * 2"
  workflow_dispatch:
    inputs:
      # The one way to spend the MCP arm's 15 paid runs off the schedule: the owner asks for it by
      # name (D-20261027-b1-mcp-arm-owner-dispatch). Off by default, so a bare dispatch runs the two
      # CLI arms only, as it always did. A dispatch with it set lands its reading like the weekly one.
      mcp-arm:
        description: "Run B1's paid MCP arm (15 more agent runs) and land the reading"
        type: boolean
        default: false

# On a PR a newer push supersedes the run. On main a started run finishes: B1 is an hour of paid
# agent runs, and cancelling it threw away the spend and the reading. 21 of 30 runs on main were
# cancelled on 2026-10-08. GitHub keeps one run and only the newest pending one, so commits in
# between are skipped before they start, not killed halfway.
#
# `labeled` is here for `bench:agent` alone. Any other label (`gh pr create --label skip-changeset`
# raises one `labeled` per label beside `opened`) starts a run that runs no job and sits in a group
# of its own, keyed by its run id, so it cancels nothing: before, it cancelled the run of the change
# and the B4 gate read cancelled (#1429). `bench:agent` is a whole pull request run, the gate with
# it, and supersedes the one before it as a push does (scripts/pr-trigger-lock.test.ts).
concurrency:
  group: bench-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'bench:agent' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # The pull request's share of this file: the axes whose numbers do not move with the machine.
  # B4 weight is bytes (a bundle and an install, against the package each entry point replaces),
  # reliability is bytes and exit codes, the floor is a checklist score — each a ratchet a PR can
  # be held to. The cold-start, runtime and compat-suite axes are timings or the oracle's long run
  # and gate the nightly `cheap` job instead. One build for all three; the two commands write the
  # same `<date>-<sha>-ci.json` names, which is harmless here because a pull request lands nothing.
  gate:
    name: B4 weight · reliability · N10 floor (pull request gate)
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'bench:agent')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build (the axes measure what is built, never what is written)
        run: npx turbo run build --concurrency=4
      - name: Install the two floor checkers, pinned by version and digest
        run: npx tsx benchmarks/floor-tools.ts
      - name: B4 weight and reliability, every gate checked
        shell: bash
        run: npm run bench -- --axis weight --axis reliability --check 2>&1 | tee gate.log
      - name: N10 floor, burgee's ratchet checked
        shell: bash
        run: npm run bench -- --axis floor --check 2>&1 | tee -a gate.log
      - name: Summary
        if: always()
        run: |
          { echo '## Benchmarks (pull request gate)'; echo; echo '```'; cat gate.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cheap:
    name: B2 cold start · B3 compatibility · B4 weight
    # Nightly and on demand. Not on the weekly B1 cron: that would land a second observation the
    # same day, and B1's reading lands on its own branch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '40 5 * * 2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` cannot be read in a step's `if:`; a job-level env of the boolean can.
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.RELEASE_BOT_PAT != '' }}
    steps:
      # No persisted credentials: checkout v7 keeps GITHUB_TOKEN in an includeIf config the
      # landing step's `--unset-all …extraheader` cannot reach, and that header outranks the
      # token in the push URL. Every push after the PR opened went out as github-actions[bot],
      # whose runs wait for approval and which the review action refuses (#858, 2026-10-08).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build (the axes measure what is built, never what is written)
        run: npx turbo run build --concurrency=4
      # `bench:page --check` moved to quality.yml's `fast` job. It was
      # correct here and it ran here — but this job reports
      # `B2 cold start · B3 compatibility · B4 weight`, which is not a required
      # context, so a red page check did not stop a merge. Its sibling proved the
      # cost: `compat:page --check` failed on PR #197 and the PR merged 29 seconds
      # later. The check compares the committed page against the COMMITTED results,
      # so it never needed this job's measurements — only a gate that blocks.
      # The scale bench's own tests (Z5): out of the default run (benchmarks/vitest.config.ts),
      # so they run here on the nightly schedule and on demand, never on a push or pull request.
      - name: Scale bench tests (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: benchmarks
        env:
          BENCH_SCALE: "1"
        run: npx vitest run scale.test.ts
      - name: Run the cheap axes and check every gate
        shell: bash
        # `reliability` belongs here and was left out when it landed: it spawns a demo CLI
        # ten times per variant, needs no credential, and its numbers — hangs, exit codes,
        # `--json` envelopes, bytes — do not move with the machine. Without it the axis ran
        # nowhere at all, so `/docs/benchmarks` said it had not run and would have gone on
        # saying that, and its three bands had no series to read. `runtime` is B5 — ours ÷ the
        # incumbent in-process, one ratchet per pair (D-20260929-b5-runtime-ratchets).
        run: npm run bench -- --axis perf --axis compat --axis weight --axis reliability --axis runtime --check 2>&1 | tee bench.log
      - name: Summary
        if: always()
        run: |
          { echo '## Benchmarks'; echo; echo '```'; cat bench.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-results
          path: benchmarks/results/cli-benchmarks/*.json
          if-no-files-found: ignore
          retention-days: 30

      # A PR opened with `github.token` raises no workflow runs, so it never gets its required
      # checks and `--auto` never fires. Same credential chain as changesets-pr.yml and evals.yml.
      - name: Mint the release App's token
        id: app
        if: vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # A band with no committed observations is a band that never computes. The Stage 6
      # watcher reads dated files out of the checkout, so a run that only uploads an
      # artifact feeds it nothing — which is how the two agent bands sat at 0 of 8 from
      # the day they were written. Same shape control-bands.yml already uses.
      # The scheduled run only, so the bench-series PR is opened or extended at most once a night.
      - name: Land the day's observations, so the bands have a series to watch
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT || github.token }}
          SOURCE: ${{ steps.app.outputs.token != '' && 'app' || (env.HAS_PAT == 'true' && 'pat' || 'github-token') }}
          BODY: "Observations from `npm run bench`, landed so the Stage 6 bands in `.sdlc/bands/control-bands.json` have a series to read. A series that stops updating looks perfectly healthy, which is why these landing is what keeps the bands honest."
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain benchmarks/results/)" ]; then
            echo "Nothing new to record."; exit 0
          fi
          # An observation, not a republication. The run just overwrote the *published*
          # measurements — the ones `/docs/benchmarks` and `/docs/comparison` are generated
          # from and pinned against — with this runner's numbers. Its `installed-bytes` rows
          # are byte-identical wherever it runs, and its `cold-start-ms` rows are a property
          # of the box: on 2026-09-09 the same commit read +22.6 ms here and +8.0 ms on a
          # two-core runner. So each file is copied aside under the commit that produced it
          # and the published one is restored. The bands glob the directory and read both;
          # the docs read only the dated name. See `benchmarks/published.ts`.
          # `mv`, not `cp`, and the difference shows up on day two rather than day one. A
          # run on a date that has never been published writes a *new* `YYYY-MM-DD.json`,
          # and `git checkout --` does not remove an untracked file: with `cp` that file is
          # staged too, and a CI runner's numbers become a published measurement under the
          # exact name this split reserves for a chosen one. Moving it leaves nothing behind
          # in either case — a modified file is restored by the checkout, a new one is gone.
          # `run.ts` now names an incomplete document as an observation itself — this job
          # runs axis subsets, so its files already end in `<sha>-ci`. Renaming one again would
          # give `<date>-<sha>-ci-<sha>-ci.json`, which `published.ts` reads as neither shape.
          # The `-ci` is D-142: a local run of the same commit is a different observation, and
          # before the suffix it had this file's exact path — #419 was closed for that.
          for f in $(git status --porcelain benchmarks/results/ | awk '{print $NF}'); do
            case "$f" in
              *-${GITHUB_SHA::7}-ci.json) ;;
              *) mv "$f" "${f%.json}-${GITHUB_SHA::7}-ci.json" ;;
            esac
          done
          git checkout -- benchmarks/results/
          # One rolling branch and PR, not one per night. Every file here is named by its
          # commit, so observations never collide and each run just adds commits on top.
          # A per-commit branch opened a PR on every merge to main — 21 of them sat
          # unmergeable at once, because a GITHUB_TOKEN PR raises no checks (C5).
          BRANCH="chore/bench-series"
          TITLE="chore(benchmarks): record benchmark observations"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # checkout persisted `github.token` as an auth header, which would win over the URL.
          git config --unset-all http.https://github.com/.extraheader || true
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # While the rolling PR is open, add to it; once it has merged or closed, start
          # the branch again from this main so it never carries already-landed commits.
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            git fetch "$REMOTE" "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            OPEN=1
          else
            git checkout -B "$BRANCH"
            OPEN=0
          fi
          git add benchmarks/results/
          git commit -m "$TITLE"
          if [ "$OPEN" = 1 ]; then
            git push "$REMOTE" "HEAD:refs/heads/$BRANCH"
          else
            git push --force "$REMOTE" "HEAD:refs/heads/$BRANCH"
            gh pr create --base main --head "$BRANCH" --label skip-changeset --title "$TITLE" --body "$BODY"
          fi
          if [ "$SOURCE" = "github-token" ]; then
            echo "::warning title=PR opened with GITHUB_TOKEN::It raises no checks, so it will not auto-merge. Set RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY, or RELEASE_BOT_PAT — see .sdlc/gaps/C5.md."
          fi
          # With the App token or RELEASE_BOT_PAT this PR gets its required checks and `--auto`
          # merges it. With only `github.token` it sits at BLOCKED with zero failures forever;
          # 65 of them were landed by hand as #570.
          # A held PR (hold, do-not-merge, wip) is left alone: on a PR that is already mergeable,
          # `--auto` merges at once rather than arming, which is how #1049, #1050 and #1055 merged.
          # Fail closed: labels that cannot be read count as held.
          HELD=$(gh pr view "$BRANCH" --json labels --jq '[.labels[].name]|any(.=="hold" or .=="do-not-merge" or .=="wip")') || HELD=true
          if [ "$HELD" = true ]; then
            echo "::notice::$BRANCH is held (hold, do-not-merge or wip, or its labels could not be read); not arming auto-merge."
          else
            gh pr merge --auto --squash "$BRANCH" || true
          fi

  # N10 — the floor, graded by two published checklists we did not write: clispec.dev v0.3
  # and cli-agent-lint's 34 checks. Its own job and its own suite (`external-floor`),
  # because two `npm run bench` commands in one checkout write the same
  # `<date>-<sha>-ci.json` name for every suite, and the second would overwrite the first's
  # measurements with `not-run`. Free and deterministic: its ratchet gates every PR inside
  # `gate`, and this job grades main nightly and keeps the artifact. The one network step is
  # the download, which `floor-tools.ts` refuses unless the archive's SHA-256 is the pinned one.
  floor:
    name: N10 external floor (clispec · cli-agent-lint)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '40 5 * * 2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build (the checkers grade the built demo, never the source)
        run: npx turbo run build --concurrency=4
      - name: Install the two checkers, pinned by version and digest
        run: npx tsx benchmarks/floor-tools.ts
      - name: Grade the floor and check burgee's ratchet
        shell: bash
        run: npm run bench -- --axis floor --check 2>&1 | tee floor.log
      - name: Summary
        if: always()
        run: |
          { echo '## N10 external floor'; echo; echo '```'; cat floor.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # What `--publish` would have written, kept so a person can promote a CI run to the
      # published measurement the way #129 did for `cli-benchmarks` — the runner, not a laptop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: floor-results
          path: benchmarks/results/external-floor/*.json
          if-no-files-found: ignore
          retention-days: 30

  agent:
    name: B1 agent cost (skips loudly without a credential)
    # Never on a PR by default: it spends money per run, it is noisy over short
    # intervals, and a fork PR cannot read the credential anyway. A PR that
    # moves the manifest, the help renderer or the MCP surface is exactly where
    # agent cost changes, so `bench:agent` asks for it explicitly.
    # Not on a push to main (D-20261019-b1-weekly-not-per-push): one weekly reading, the PRs that
    # ask by label and the owner's dispatches bound the spend. `ci-axes.test.ts` evaluates this condition per event.
    # The weekly cron only: the nightly one (D-20261101-heavy-ci-runs-nightly) would spend the
    # quota seven times a week.
    if: >-
      github.event.schedule == '40 5 * * 2' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'bench:agent') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bench:agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # No persisted credentials: the landing step below pushes with its own token (see `cheap`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: npx turbo run build --concurrency=4
      # The axis spawns `claude` and skips if it cannot. Nothing installed it, so every run
      # since this job landed skipped for "the `claude` binary is not on PATH" and opened
      # issue #146 saying so — the credential was there the whole time.
      - name: Install the agent the axis measures
        run: npm ci --prefix .github/tools/claude-code --no-audit --no-fund && echo "$PWD/.github/tools/claude-code/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run B1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Every run's full event stream, one file a run — what the agent ran and what the
          # CLI answered, turn by turn. Outside benchmarks/results/ so the landing step never
          # commits it; uploaded below. The first CI reading (run 36740119305) disagreed
          # with the local one and had nothing a reader could open to see why.
          BENCH_AGENT_TRANSCRIPTS: ${{ runner.temp }}/b1-transcripts
          # The MCP arm's spend bound (b1-mcp-arm R4): `1` on the schedule, a `bench:agent` PR and
          # a dispatch with `mcp-arm` set, `0` everywhere else, and the axis runs the arm only on `1`. It also waits on the
          # owner: the repository variable B1_MCP_ARM must read `approved` (spec.md, "Cost"), so
          # merging the harness spends nothing. The one place it is set; `ci-axes.test.ts`
          # evaluates this expression for every event.
          BENCH_AGENT_MCP: ${{ (vars.B1_MCP_ARM == 'approved' && (github.event.schedule == '40 5 * * 2' || (github.event_name == 'workflow_dispatch' && inputs.mcp-arm) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench:agent')))) && '1' || '0' }}
        shell: bash
        # `--check` so the one gated record on this axis can fire. `success-rate`
        # is a floor on the harness, not on the model: a run where a third of the
        # task-runs failed still emits tokens and turns medians, taken over
        # whichever runs survived, and without a gate that lands in a band with
        # nothing anywhere saying the measurement changed shape. A skip stays
        # green — it emits no records, so there is no gate to fail.
        run: npm run bench -- --axis agent --check 2>&1 | tee agent.log

      # The results file is the authority on whether anything was measured, not the
      # exit code: the axis exits 0 when it skips, on purpose, so a missing credential
      # is not confused with a broken harness.
      # `always()`: the run step now carries `--check`, so it can fail on the
      # success-rate gate — and a gate failure is precisely a run whose status and
      # reason someone needs to read in the summary.
      - name: Did it actually measure anything?
        id: status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Newest by mtime, not by name: the file this run just wrote. By name, any committed
          # observation of the same day with a later sha sorts after it and is read instead.
          # `sed -n 1p`, not `head -n 1`: head exits after one line, `ls` takes SIGPIPE writing
          # the rest of 200+ names, and pipefail turns that into "ls: write error: Broken pipe",
          # exit 2 — which is how run 36352045743 lost its status, reason and summary.
          FILE=$(ls -1t benchmarks/results/agent-cli-bench/*.json | sed -n 1p)
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('$FILE','utf8')).axes.agent.status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('$FILE','utf8')).axes.agent.reason || ''")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "measured" ]; then
            echo "::notice title=B1 measured::$FILE"
          else
            echo "::warning title=B1 SKIPPED — the roadmap's headline claim is still unmeasured::$REASON"
          fi
          { echo "## B1 agent cost — **$STATUS**"; echo; [ -n "$REASON" ] && echo "> $REASON"; echo; echo '```'; cat agent.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Per task, per variant: the runs behind each median (`perTaskDetail` in agent.ts).
          FILE="$FILE" node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.FILE, "utf8"));
            for (const r of d.records ?? []) {
              if (r.axis !== "agent" || r.metric !== "success-rate") continue;
              const t = r.detail ?? {};
              console.log(`\n### ${r.variant} — ${t.claude ?? "claude ?"} (pinned: ${t.claudePinned}), env: ${t.env}\n`);
              console.log("| task | turns | tokens | passed | denials | failures |\n|---|---|---|---|---|---|");
              for (const id of new Set(Object.keys(t).filter((k) => k.endsWith(".turns")).map((k) => k.slice(0, -6))))
                console.log(`| ${id} | ${t[id + ".turns"]} | ${t[id + ".tokens"]} | ${t[id + ".passed"]} | ${t[id + ".denials"]} | ${t[id + ".failures"] ?? ""} |`);
            }' >> "$GITHUB_STEP_SUMMARY" || true

      # Scheduled: between Tuesdays, every push to main once reported this
      # job green while it measured nothing, which is the exact shape of thing
      # a green tick hides for a year. A PR run stays quiet — the summary and
      # the ::warning:: are enough there, and one issue per labelled PR is noise.
      # Redacted by the harness before they are written. Kept 14 days: long enough to read
      # the last run's transcripts, short enough that nobody treats them as the record.
      # B1's own reading never reached the tree: the `cheap` job lands the three suites with the
      # agent axis `not-run`, and this job only uploaded transcripts. So the claim table, the
      # agent bands and C1 had no CI document to read while B1 measured on every push (found
      # 2026-10-08, four readings visible only in job logs). It lands its one file the same way.
      - name: Mint the release App's token
        id: app
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mcp-arm)) && steps.status.outputs.status == 'measured' && vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The weekly reading lands too: it is the one that carries the MCP arm, and the claim
      # `cli-vs-mcp-tokens` reads four of them. It lands as `<date>-<sha>-weekly-ci.json`,
      # because the schedule measures whatever main's head is, and the nightly reading of that same
      # commit on the same day already holds `<date>-<sha>-ci.json`. An owner dispatch with `mcp-arm`
      # set lands as `<date>-<sha>-dispatch-<run id>-ci.json`: two dispatches of one commit on one day
      # would otherwise share a name, and the run id is what the published page cites.
      - name: Land B1's observation
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mcp-arm)) && steps.status.outputs.status == 'measured'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_BOT_PAT || github.token }}
          BODY: "B1's agent-cost reading from main, landed so `agent-tokens-40pct`, `agent-turns-30pct`, `cli-vs-mcp-tokens` and the agent bands have a CI series to read."
        run: |
          set -euo pipefail
          FILE=$(ls -1t benchmarks/results/agent-cli-bench/*.json | sed -n 1p)
          case "$FILE" in
            *-${GITHUB_SHA::7}-ci.json) ;;
            *) mv "$FILE" "${FILE%.json}-${GITHUB_SHA::7}-ci.json"; FILE="${FILE%.json}-${GITHUB_SHA::7}-ci.json" ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            mv "$FILE" "${FILE%-ci.json}-weekly-ci.json"; FILE="${FILE%-ci.json}-weekly-ci.json"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mv "$FILE" "${FILE%-ci.json}-dispatch-${GITHUB_RUN_ID}-ci.json"; FILE="${FILE%-ci.json}-dispatch-${GITHUB_RUN_ID}-ci.json"
          fi
          KEEP=$(mktemp); cp "$FILE" "$KEEP"
          git checkout -- benchmarks/results/ && git clean -fdq benchmarks/results/
          BRANCH="chore/b1-series"
          TITLE="chore(benchmarks): record B1 agent-cost observations"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            git fetch "$REMOTE" "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            OPEN=1
          else
            git checkout -B "$BRANCH"
            OPEN=0
          fi
          cp "$KEEP" "$FILE"
          git add "$FILE"
          git commit -m "$TITLE"
          if [ "$OPEN" = 1 ]; then
            git push "$REMOTE" "HEAD:refs/heads/$BRANCH"
          else
            git push --force "$REMOTE" "HEAD:refs/heads/$BRANCH"
            gh pr create --base main --head "$BRANCH" --label skip-changeset --title "$TITLE" --body "$BODY"
          fi
          # A held PR (hold, do-not-merge, wip) is left alone: on a PR that is already mergeable,
          # `--auto` merges at once rather than arming, which is how #1049, #1050 and #1055 merged.
          # Fail closed: labels that cannot be read count as held.
          HELD=$(gh pr view "$BRANCH" --json labels --jq '[.labels[].name]|any(.=="hold" or .=="do-not-merge" or .=="wip")') || HELD=true
          if [ "$HELD" = true ]; then
            echo "::notice::$BRANCH is held (hold, do-not-merge or wip, or its labels could not be read); not arming auto-merge."
          else
            gh pr merge --auto --squash "$BRANCH" || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: b1-transcripts
          path: ${{ runner.temp }}/b1-transcripts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Say so, where someone will see it
        if: >-
          github.event_name == 'schedule' &&
          steps.status.outputs.status != 'measured'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.status.outputs.reason }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="B1 agent cost has never been measured"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n> %s\n\nUntil this runs, the roadmap headline — ≥40%% fewer tokens and ≥30%% fewer turns — is a claim with no number behind it, and `npm run bench` reports it as `unmeasured` rather than guessing.\n\n[Run](%s)\n' "The B1 run on $GITHUB_EVENT_NAME skipped." "$REASON" "$RUN_URL")
          # An open issue is already the signal; the weekly run is what keeps saying it.
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi
