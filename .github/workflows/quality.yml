# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Quality Gate

run-name: >-
  Quality · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message || format('merge queue · {0}', github.ref_name) }}

# ─────────────────────────────────────────────────────────────────────────────
# Fast-loop quality gate — every PR push and every push to main. Same split as
# ofri-peretz/eslint: cheap checks here (~1 min), heavy ones (test / build /
# typecheck) in quality-full.yml once a PR is ready for review.
#
#   - Lint (Interlace ESLint plugins, --max-warnings 0)
#   - Markdown Lint
#   - Workflow Conventions (scripts/lint-workflows.ts)
#   - Lockfile Sync
#
# `Quality Gate` is the single required status check for branch protection.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `Quality Gate` is a required status check, and a required check with no `merge_group:`
  # trigger never reports inside the queue — the entry neither merges nor fails. Enforced by
  # REQUIRED_CHECKS in scripts/lint-workflows.ts.
  merge_group:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (Interlace plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately uncached: burgee is a customer of the Interlace ESLint plugins and this
      # job's fresh `npm ci` is a real install of every one of them, on every run. It runs
      # in parallel with the other checks, so the ~40s it costs is off the critical path.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
          node-modules-cache: "false"
      - run: npx eslint . --max-warnings 0

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:md

  workflows:
    name: Workflow Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:workflows

  lockfile:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify package-lock.json is in sync
        # `npm ci --dry-run` validates the manifests against the lock without rewriting it.
        # The previous check re-ran `npm install --package-lock-only` and diffed, but npm
        # records the wasm32 optional's dependencies (@emnapi/*) only on some platforms, so
        # a lock that installs everywhere never round-trips on Linux and a lock that
        # round-trips on Linux fails `npm ci` everywhere ("Missing: @emnapi/core").
        run: |
          set -euo pipefail
          if ! npm ci --dry-run --ignore-scripts --no-audit --no-fund; then
            echo "::error::package-lock.json is out of sync with package.json. Run \`npm install\` and commit the lockfile."
            exit 1
          fi
          echo "✅ Lockfile is in sync."

  # A page whose gate is not REQUIRED is a page with no gate.
  #
  # `bench:page --check` already existed and already worked — it sat in bench.yml's
  # `cheap` job, which reports `B2 cold start · B3 compatibility · B4 weight` and is not a
  # required context. Its sibling on the other generated page proved what that is worth:
  # `compat:page --check` went RED on PR #197 at 14:44:16 and the PR merged at 14:44:45,
  # 29 seconds later, because nothing was stopping it. main was red until #199.
  #
  # It lives here, in the fast lane the required `Quality Gate` aggregates, rather than
  # beside the benchmark run, for two reasons: it belongs to a required check, and it is
  # 0.4s of `tsx` over committed JSON — it has no business waiting behind a 30-minute
  # benchmark job whose perf gates are the flaky part (issue #27). Comparing the committed
  # page against the COMMITTED results is the whole point, so nothing needs measuring
  # first.
  #
  # `compat:page --check` cannot move here: its inputs (`results.json`,
  # `results.control.json`) are produced by grading and are not committed. It stays in
  # compat.yml's `ratchet` job, which this change makes a required context instead.
  generated-pages:
    name: Generated Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: The published benchmarks page is the one the committed results generate
        run: npm run bench:page -- --check

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, markdown, workflows, lockfile, generated-pages]
    if: always()
    steps:
      - name: Render gate report
        env:
          R_LINT: ${{ needs.lint.result }}
          R_MARKDOWN: ${{ needs.markdown.result }}
          R_WORKFLOWS: ${{ needs.workflows.result }}
          R_LOCKFILE: ${{ needs.lockfile.result }}
          R_PAGES: ${{ needs['generated-pages'].result }}
        run: |
          set -euo pipefail
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; skipped) echo "⏭";; *) echo "⚠️";; esac; }
          all_pass=true
          for r in "$R_LINT" "$R_MARKDOWN" "$R_WORKFLOWS" "$R_LOCKFILE" "$R_PAGES"; do [ "$r" = "success" ] || all_pass=false; done
          {
            if $all_pass; then echo "# ✅ Fast quality gates passed"; else echo "# ❌ One or more fast quality gates failed"; fi
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Lint (11 Interlace plugins, 0 warnings) | $(icon "$R_LINT") $R_LINT |"
            echo "| Markdown lint | $(icon "$R_MARKDOWN") $R_MARKDOWN |"
            echo "| Workflow conventions | $(icon "$R_WORKFLOWS") $R_WORKFLOWS |"
            echo "| Lockfile sync | $(icon "$R_LOCKFILE") $R_LOCKFILE |"
            echo "| Generated pages match their sources | $(icon "$R_PAGES") $R_PAGES |"
            echo ""
            echo "_Heavy gates (test / build / typecheck) run in \`quality-full.yml\` once the PR is ready for review or labelled \`run-full-ci\`._"
          } >> "$GITHUB_STEP_SUMMARY"
          $all_pass || { echo "::error::One or more quality gates failed"; exit 1; }
