# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Quality Gate

run-name: >-
  Quality · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message }}

# ─────────────────────────────────────────────────────────────────────────────
# Fast-loop quality gate — every PR push and every push to main. Same split as
# ofri-peretz/eslint: cheap checks here (~1 min), heavy ones (test / build /
# typecheck) in quality-full.yml once a PR is ready for review.
#
#   - Lint (Interlace ESLint plugins, --max-warnings 0)
#   - Markdown Lint
#   - Workflow Conventions (scripts/lint-workflows.ts)
#   - Lockfile Sync
#
# `Quality Gate` is the single required status check for branch protection.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (Interlace plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      # Deliberately uncached: burgee is a customer of the Interlace ESLint plugins and this
      # job's fresh `npm ci` is a real install of every one of them, on every run. It runs
      # in parallel with the other checks, so the ~40s it costs is off the critical path.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
          node-modules-cache: "false"
      - run: npx eslint . --max-warnings 0

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:md

  workflows:
    name: Workflow Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:workflows

  lockfile:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify package-lock.json is in sync
        # `npm ci --dry-run` validates the manifests against the lock without rewriting it.
        # The previous check re-ran `npm install --package-lock-only` and diffed, but npm
        # records the wasm32 optional's dependencies (@emnapi/*) only on some platforms, so
        # a lock that installs everywhere never round-trips on Linux and a lock that
        # round-trips on Linux fails `npm ci` everywhere ("Missing: @emnapi/core").
        run: |
          set -euo pipefail
          if ! npm ci --dry-run --ignore-scripts --no-audit --no-fund; then
            echo "::error::package-lock.json is out of sync with package.json. Run \`npm install\` and commit the lockfile."
            exit 1
          fi
          echo "✅ Lockfile is in sync."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, markdown, workflows, lockfile]
    if: always()
    steps:
      - name: Render gate report
        env:
          R_LINT: ${{ needs.lint.result }}
          R_MARKDOWN: ${{ needs.markdown.result }}
          R_WORKFLOWS: ${{ needs.workflows.result }}
          R_LOCKFILE: ${{ needs.lockfile.result }}
        run: |
          set -euo pipefail
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; skipped) echo "⏭";; *) echo "⚠️";; esac; }
          all_pass=true
          for r in "$R_LINT" "$R_MARKDOWN" "$R_WORKFLOWS" "$R_LOCKFILE"; do [ "$r" = "success" ] || all_pass=false; done
          {
            if $all_pass; then echo "# ✅ Fast quality gates passed"; else echo "# ❌ One or more fast quality gates failed"; fi
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Lint (11 Interlace plugins, 0 warnings) | $(icon "$R_LINT") $R_LINT |"
            echo "| Markdown lint | $(icon "$R_MARKDOWN") $R_MARKDOWN |"
            echo "| Workflow conventions | $(icon "$R_WORKFLOWS") $R_WORKFLOWS |"
            echo "| Lockfile sync | $(icon "$R_LOCKFILE") $R_LOCKFILE |"
            echo ""
            echo "_Heavy gates (test / build / typecheck) run in \`quality-full.yml\` once the PR is ready for review or labelled \`run-full-ci\`._"
          } >> "$GITHUB_STEP_SUMMARY"
          $all_pass || { echo "::error::One or more quality gates failed"; exit 1; }
