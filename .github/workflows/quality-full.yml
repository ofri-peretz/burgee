# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Quality (Full)

run-name: >-
  Quality (Full) · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || (github.event_name == 'schedule' && 'Weekly drift scan' || github.event_name) }}

# ─────────────────────────────────────────────────────────────────────────────
# Heavy half of the gate — Tests, Build, Typecheck, Coverage, Mutation. Ported from
# ofri-peretz/eslint/quality-full.yml.
#
# Runs on: push to main (post-merge verification), non-draft PRs, PRs labelled
# `run-full-ci`, manual dispatch, weekly Sunday 04:00 UTC. Draft PRs without
# the label skip it. Mirror locally with `npm run ci:local`.
#
# `Quality (Full) Gate` is a required status check for branch protection.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled, synchronize]
  # Required check — see the note in quality.yml. Every job's `if:` already answers true
  # for any event that is not a pull request, so a queue entry runs the full set.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: quality-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # There is no separate `Gate` job deciding whether the heavy jobs run. It used to be one —
  # a three-second job whose only output was `run=true|false` — and every job below `needs:`
  # it, so each of them was only *queued* once it finished. On a saturated account (20
  # concurrent jobs shared with ofri-peretz/eslint) that one hop cost a full runner-queue
  # wait before test/build/typecheck even entered the queue: 112 s median, 584 s p90 across
  # 20 PR runs (2026-09-24 → 27). The decision is the same expression evaluated on each job
  # instead, so the jobs queue at push time:
  #
  #   run  ⇔  event is not a pull request  ∨  the PR is not a draft  ∨  it carries `run-full-ci`
  #
  # Draft PRs without the label still skip every heavy job and the gate below, exactly as
  # before. Keep the six copies of the condition identical.
  test:
    name: Unit Tests (Turbo)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Build first, then test. Every docs app's `test` depends on its own `build`, so a bare
      # `turbo run test` runs ten Next builds alongside the package suites, and the
      # timing-bound tests among them lose the CPU: burgee's PowerShell completion case, about
      # six seconds cold on a runner, timed out at 45 s. Built first, the test step hits
      # turbo's cache for every build and runs the suites on a quiet machine. Four at a time,
      # one per core: at turbo's default ten the runner died with exit 137 (see compat.yml).
      - run: npx turbo run build --concurrency=4
      # The repository's own locks (`scripts/*.test.ts`: generated pages, the API reference,
      # claims, gaps, decisions, workflows). They ran only in the pre-push hook and in
      # compat.yml's matrix, and neither is a required check. Two PRs each green on their own
      # base merged into a stale API reference on main (#891 added a `renderHelp` option the
      # generated page lacked), and every PR after it, the release PR included, failed the lock.
      # Here it runs on the merge ref and feeds the required Quality (Full) Gate.
      - name: The repository's own locks
        run: npx vitest run --config vitest.root.config.ts
      # Every workspace's suite on a push, the merge queue, the weekly scan, a dispatch, the
      # `run-full-ci` label or a root change; on any other pull request, each workspace it
      # changed and each that depends on one, docs apps included (`scripts/affected.mts`,
      # D-20261012-ci-affected-pr-lanes). The locks above always run in full.
      - name: Each affected workspace's suite
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --base "$BASE")
          if [ "$FULL" = true ]; then args+=(--full); fi
          set_json=$(node scripts/affected.mts "${args[@]}")
          echo "$set_json"
          if [ "$(jq -r .full <<<"$set_json")" = true ]; then npx turbo run test --concurrency=4; exit 0; fi
          mapfile -t filters < <(jq -r '.workspaces[] | "--filter=" + .' <<<"$set_json")
          if [ "${#filters[@]}" -eq 0 ]; then echo "No workspace changed against $BASE; the locks above are the suite."; exit 0; fi
          npx turbo run test "${filters[@]}" --concurrency=4

  build:
    name: Build (Turbo)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          next-cache: "true"
      - run: npx turbo run build --concurrency=4
      # The published-artifact gate, on every PR. It ran only in the lint job, which is not
      # required, and at release: #828 grew seniority's tarball 14.6% and merged, and
      # release.yml then refused three main commits and held four 1.0.0s back. Here it feeds
      # Quality (Full) Gate, which is required.
      - run: npm run check:artifacts

  typecheck:
    name: Typecheck (Turbo)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npx turbo run typecheck --concurrency=4

  # Every package's coverage thresholds (100%, or the few its own vitest config lowers), on
  # every PR, so a suite that stops covering its source cannot merge. Until 2026-09-30 they
  # ran only in the weekly `codecov.yml` job, and burgee's had failed there unseen: zsh and
  # fish are not on ubuntu-latest, so the completion cases skipped and the code only they
  # reach was uncovered. The shells are installed here, and `REQUIRE_SHELLS=1` makes a missing
  # one fail those suites instead of skipping them.
  #
  # Only the packages a PR can have changed: each one that changed against the base, and each
  # package that depends on one, limited to `packages/*` so no docs app is built — the same set
  # every affected lane reads, from `scripts/affected.mts`. A push to main, the merge queue, the
  # weekly scan, a dispatch, the `run-full-ci` label and a root change run them all.
  coverage:
    name: Coverage (changed packages)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The same step as completions.yml, and for the same reason: only Ubuntu's own sources.
      - name: Install zsh and fish
        run: |
          set -euo pipefail
          sudo apt-get update -q \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y -q zsh fish
      # Every package built first, not only the affected ones. A suite may import a package it
      # does not depend on: burgee's `facade-types.test.ts` type-checks every drop-in `migrate`
      # rewrites to, `controlroom/ink` among them, and `coverage` depends only on its own
      # `build`. With controlroom in the affected set the two raced at `--concurrency=2` and
      # burgee failed with "controlroom/ink does not resolve" (release PR, #827); without it
      # in the set, nothing would build controlroom at all.
      - name: Build every package
        run: npx turbo run build --filter='./packages/*'
      - name: Each affected package's suite, against its coverage thresholds
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
          REQUIRE_SHELLS: "1"
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --base "$BASE")
          if [ "$FULL" = true ]; then args+=(--full); fi
          mapfile -t pkgs < <(node scripts/affected.mts "${args[@]}" | jq -r '.packages[]')
          if [ "${#pkgs[@]}" -eq 0 ]; then echo "No package changed against $BASE; nothing to cover."; exit 0; fi
          echo "Coverage for: ${pkgs[*]}"
          filters=()
          for p in "${pkgs[@]}"; do filters+=("--filter=$p"); done
          npx turbo run coverage "${filters[@]}" --concurrency=2
      # A threshold failure prints only the percentages. This names each uncovered line and
      # function, from the lcov every package writes, so the fix is readable from the log.
      - name: Name what is not covered
        if: failure()
        run: |
          set -euo pipefail
          for report in packages/*/coverage/lcov.info; do
            awk -v pkg="$(basename "$(dirname "$(dirname "$report")")")" -F'[:,]' '
              /^SF:/ { file = $2 }
              /^DA:/ && $3 == 0 { print pkg "/" file ":" $2 " line not covered" }
              /^FNDA:0,/ { print pkg "/" file " function " $3 " not covered" }
              /^BRDA:/ && ($5 == "-" || $5 == 0) { print pkg "/" file ":" $2 " branch not covered" }
            ' "$report"
          done

  # A surviving mutant is a test suite that passes on broken code (.sdlc/intents/mutation-tested/).
  # Stryker mutates only the lines this pull request added or changed, in the packages
  # `scripts/affected.mts` names, and the job fails when one of those mutants is not detected —
  # unless its line carries `// Stryker disable next-line <Mutator>: <reason>`. A PR that changes
  # no package source, and every event that is not a pull request, reports success from a step;
  # the weekly `mutation.yml` measures main in full.
  #
  # Budget (R3): 15 minutes for the job, 11 of them for Stryker (`PR_BUDGET` in the script). A
  # pull request whose changed lines need longer fails saying so rather than passing unmeasured.
  mutation:
    name: Mutation (changed lines)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Which lines to mutate
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha || '') }}
        run: |
          set -euo pipefail
          plan=$(npx tsx scripts/mutation.ts changed --event "$EVENT" --base "$BASE" --plan)
          echo "$plan"
          if jq -e 'type == "object" and length > 0' <<<"$(tail -n 1 <<<"$plan")" >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      # Every package, for the reason the coverage job gives: a suite may read a sibling's dist.
      - name: Build every package
        if: steps.plan.outputs.run == 'true'
        run: npx turbo run build --filter='./packages/*' --concurrency=4
      - name: Mutate the changed lines
        if: steps.plan.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha || '') }}
        run: npx tsx scripts/mutation.ts changed --event "$EVENT" --base "$BASE" --concurrency 4 --summary "$GITHUB_STEP_SUMMARY"

  quality-full-gate:
    name: Quality (Full) Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [test, build, typecheck, coverage, mutation]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
    steps:
      - name: Render gate report
        env:
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_COVERAGE: ${{ needs.coverage.result }}
          R_MUTATION: ${{ needs.mutation.result }}
        run: |
          set -euo pipefail
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; skipped) echo "⏭";; *) echo "⚠️";; esac; }
          all_pass=true
          for r in "$R_TEST" "$R_BUILD" "$R_TYPECHECK" "$R_COVERAGE" "$R_MUTATION"; do [ "$r" = "success" ] || all_pass=false; done
          {
            if $all_pass; then echo "# ✅ All heavy quality gates passed"; else echo "# ❌ One or more heavy quality gates failed"; fi
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Unit + lock tests | $(icon "$R_TEST") $R_TEST |"
            echo "| Build | $(icon "$R_BUILD") $R_BUILD |"
            echo "| Typecheck | $(icon "$R_TYPECHECK") $R_TYPECHECK |"
            echo "| Coverage thresholds (changed packages) | $(icon "$R_COVERAGE") $R_COVERAGE |"
            echo "| Mutation (changed lines) | $(icon "$R_MUTATION") $R_MUTATION |"
            echo ""
            echo "_Run \`npm run ci:local\` to mirror these gates locally._"
          } >> "$GITHUB_STEP_SUMMARY"
          $all_pass || { echo "::error::One or more heavy quality gates failed"; exit 1; }
