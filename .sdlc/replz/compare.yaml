# `replz compare`: each file in compare-inputs is one replz command line, run through the base and
# the head's own build, so a change to replz's help or messages fails until it is approved below.
setup: npm ci --ignore-scripts --no-audit --no-fund && npx turbo run build --filter=replz... --concurrency=2
command: xargs node packages/replz/dist/bin.js
inputs: .sdlc/replz/compare-inputs
normalize:
  # The version line moves on every release.
  - 'replz \d+\.\d+\.\d+'
approved: []
